name: Build & Release

# 打 tag（v1.0.0）→ 三平台打包 → 自动发布 Release。
# 手动触发（workflow_dispatch）只跑构建、不发布，用来在 main 上试打包。
# 推送形如 v1.0.0 的 tag 就会自动在 Windows / macOS / Linux 上打包，并发布到 GitHub Releases。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, script: 'dist:win',       name: windows }
          - { os: macos-latest,   script: 'dist:mac',       name: macos }
          # Linux 固定用 24.04：26.04 自带的 rpm 6 移除了 xzmt 压缩，fpm 打不出 rpm 包
          - { os: ubuntu-24.04,   script: 'dist:linux:core', name: linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install rpm tools (Linux)
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm && rpmbuild --version
      - run: npm install
      - run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 没有代码签名证书时，不要去找证书（有证书后把这行删掉，并配置 CSC_LINK / CSC_KEY_PASSWORD）
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Build rpm (Linux)
        if: matrix.name == 'linux'
        # rpm 依赖构建机的 rpm 版本，失败也不该拖垮整个发布（AppImage / deb 才是 Linux 主流）
        continue-on-error: true
        run: npm run dist:linux:rpm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: List built artifacts
        shell: bash
        run: ls -lh dist || true
      - uses: actions/upload-artifact@v4
        with:
          name: PixPeel-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: 附上小剪动画（H5 单文件网页版）
        run: cp editor/xiaoji-animation.html artifacts/xiaoji-animation.html
      - name: SHA-256 checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
