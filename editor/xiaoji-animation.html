<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>小剪动画</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=ZCOOL+KuaiLe&family=ZCOOL+QingKe+HuangYou&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@700&display=swap">
<style>
:root{
  /* 布局：顶栏 / 左素材 · 中画布 · 右属性 / 底部时间轴。暗色影棚，橙色只留给播放头与主操作。 */
  --bg:#14131b; --panel:#1c1b26; --panel2:#262535; --line:#34324a; --fg:#ece9f6; --mut:#9a97b3;
  --acc:#ff6b3d; --acc-ink:#1b0b05; --focus:#8fb4ff; --stage:#0d0c12;
  --c-video:#3f58c9; --c-image:#26907f; --c-text:#a8741a; --c-sticker:#b04a82; --c-shape:#6a52bb; --c-audio:#2e7d52; --c-toon:#c0504a;
  --display:"ZCOOL KuaiLe","Noto Sans SC",sans-serif;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:400 13px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;overflow-x:hidden}
button,select,input,textarea{font:inherit;color:inherit}
body{-webkit-user-select:none;user-select:none}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text}
img,canvas,video{-webkit-user-drag:none}
.asset[draggable=true],.preset[draggable=true],.toon[draggable=true],.emoji-grid button[draggable=true]{cursor:grab}
.dl{display:grid;gap:8px;margin-top:10px;max-height:46vh;overflow:auto}
.drow{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 10px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--stage)}
.drow.cur{border-color:var(--acc)}
.drow img{width:96px;height:54px;object-fit:cover;border-radius:5px;background:#000}
.drow .di{min-width:0}.drow .di b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.drow .di span{color:var(--mut);font-size:12px}
.drow .db{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
#saveState{margin-left:auto;font-size:12px;color:var(--mut)}
.dropline{position:absolute;top:0;bottom:0;width:2px;background:#ffd447;pointer-events:none;z-index:5;box-shadow:0 0 6px #ffd447}
.droprow{background:rgba(255,212,71,.14)!important}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
input[type=range]{accent-color:var(--acc);width:100%;min-width:0}
input[type=color]{width:32px;height:24px;padding:0;border:1px solid var(--line);border-radius:4px;background:none;cursor:pointer}
select,textarea,input[type=text]{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0}
textarea{width:100%;resize:vertical;min-height:54px}

#app{display:grid;grid-template-rows:auto minmax(0,1fr) 292px;gap:10px;height:100%}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font:400 20px var(--display);letter-spacing:.04em}
.logo{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:6px;background:var(--acc);color:var(--acc-ink);font:400 18px var(--display);transform:rotate(-6deg)}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1;min-width:0}
.tools .sp{flex:1}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 11px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:#58557f}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--acc);color:var(--acc-ink);border-color:transparent;font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 8px;font-size:12px}
.lbl-inline{display:flex;align-items:center;gap:6px;color:var(--mut)}

.work{display:grid;grid-template-columns:232px minmax(0,1fr) 288px;gap:10px;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:0;min-width:0;display:flex;flex-direction:column}
.panel .body{overflow:auto;padding:10px;min-height:0;flex:1}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:8px 0;color:var(--mut);font-size:12px;min-width:0}
.tabs button[aria-selected=true]{color:var(--fg);border-bottom-color:var(--acc)}

/* 素材库 */
.drop{border:1.5px dashed #4a4768;border-radius:8px;padding:12px;text-align:center;color:var(--mut);cursor:pointer;display:block}
.drop:hover,.drop.over{border-color:var(--acc);color:var(--fg)}
.assets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.asset{position:relative;border-radius:7px;overflow:hidden;background:#000;border:1px solid var(--line);cursor:pointer;aspect-ratio:16/10}
.asset img,.asset video{width:100%;height:100%;object-fit:cover;display:block}
.asset .nm{position:absolute;left:0;right:0;bottom:0;padding:10px 6px 3px;font-size:11px;background:linear-gradient(transparent,rgba(0,0,0,.8));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asset .ov{position:absolute;top:4px;right:4px;display:none}
.asset:hover .ov,.asset:focus-within .ov{display:block}
.asset:hover{border-color:var(--acc)}
.sub{color:var(--mut);font-size:12px;margin:12px 0 6px}
.sub:first-child{margin-top:0}
.list{display:grid;gap:6px}
.preset{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:8px;background:var(--stage);border:1px solid var(--line);cursor:pointer;padding:6px;overflow:hidden;text-align:center}
.preset:hover{border-color:var(--acc)}
.emoji-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.emoji-grid button{background:none;border:1px solid transparent;border-radius:6px;font-size:22px;line-height:1.5;padding:0}
.emoji-grid button:hover{background:var(--panel2);border-color:var(--line)}
.tip{color:var(--mut);font-size:12px;line-height:1.6}

/* 画布 */
.stage{display:flex;flex-direction:column;min-width:0;min-height:0;gap:8px}
.cv-wrap{flex:1;min-height:0;background:var(--stage);border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:2px}
.cv-box{position:relative;box-shadow:0 6px 30px rgba(0,0,0,.5)}
.cv-box canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{inset:auto;left:-60%;top:-60%;width:220%;height:220%}
#ov{touch-action:none;cursor:default}
.transport{display:flex;align-items:center;gap:10px}
.transport .time{font:500 13px var(--mono);font-variant-numeric:tabular-nums;color:var(--fg);min-width:132px}
.transport .time i{color:var(--mut);font-style:normal}
.play{width:42px;height:34px;padding:0;font-size:15px}

/* 属性 */
.fld{display:grid;grid-template-columns:62px minmax(0,1fr) 46px;align-items:center;gap:8px;margin:5px 0}
.fld>span{color:var(--mut)}
.fld output{font:12px var(--mono);text-align:right;color:var(--fg);font-variant-numeric:tabular-nums}
.row2{display:flex;align-items:center;gap:8px;margin:6px 0;flex-wrap:wrap}
.row2>span{color:var(--mut)}
.sec{font-weight:700;margin:14px 0 6px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.sec:first-child{margin-top:2px}
.sec small{font-weight:400;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px}
.chip:hover{border-color:#58557f}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}
.kfrow{display:flex;align-items:center;gap:8px;padding:3px 6px;border-radius:5px;font:12px var(--mono)}
.kfrow:hover{background:var(--panel2)}
.kfrow .gem{width:9px;height:9px;background:var(--acc);transform:rotate(45deg);flex:none}
.kfrow button{background:none;border:0;color:var(--mut);margin-left:auto}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:4px;color:#fff;margin-right:6px}
.empty{color:var(--mut);padding:20px 8px;text-align:center;line-height:1.8}

/* 时间轴 */
.tl{display:flex;flex-direction:column;min-width:0;min-height:0}
.tl-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 10px;border-bottom:1px solid var(--line)}
.tl-bar .sp{flex:1}
.tl-bar .zoom{display:flex;align-items:center;gap:6px;color:var(--mut)}
.tl-bar .zoom input{width:110px}
kbd{font:11px var(--mono);color:var(--mut);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px}
.tl-body{display:grid;grid-template-columns:104px minmax(0,1fr);flex:1;min-height:0}
.tl-labels{border-right:1px solid var(--line);overflow:hidden;position:relative}
#tlLabInner{padding-top:26px;will-change:transform}
.tlab{height:34px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:4px;padding:0 4px 0 8px;font-size:11px;color:var(--mut);border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.tlab .nm{color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tlab .ic{display:flex;align-items:center;gap:2px;flex:none}
.tlab .ic button{all:unset;cursor:pointer;font-size:12px;padding:2px 3px;border-radius:4px;opacity:.75}
.tlab .ic button:hover{opacity:1;background:rgba(255,255,255,.08)}
.tlab .wn{font-style:normal;font-size:10px;background:#ffb347;color:#1a1020;border-radius:3px;padding:0 3px}
.tlab.on{background:rgba(143,123,255,.2);box-shadow:inset 2px 0 0 #8f7bff}
.tlab.off .nm{opacity:.45;text-decoration:line-through}
.tlab.aud .nm{color:#8fe3b0}
.tlab.spare{opacity:.55;font-style:italic}.tlab.spare .nm{color:var(--mut)}
.trow.hid{opacity:.4}
.laygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;margin-top:8px}
.lay{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border:1px solid var(--line);border-radius:8px;font-size:11px;color:var(--fg);background:rgba(255,255,255,.03)}
.lay:hover,.lay:focus-visible{border-color:#8f7bff;background:rgba(143,123,255,.12)}
.lay svg{background:#0e0d14;border-radius:4px}
.btn.danger{color:#ff8a8a}
input[type=text]#trName{flex:1;min-width:0}
.tl-scroll{overflow:auto;position:relative;min-width:0}
.tl-inner{position:relative;min-height:100%}
.ruler{height:26px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:7;cursor:text;background:var(--panel)}
.rb{position:absolute;bottom:0;width:0;height:0;margin-left:-3px;border:3px solid transparent;border-bottom:5px solid rgba(255,140,80,.55);border-top:0;pointer-events:none}
.rb.f{margin-left:-4px;border-width:4px;border-top:0;border-bottom:7px solid #ff8c50}
.rm{position:absolute;top:2px;width:2px;height:22px;margin-left:-1px;background:#4cc9f0;cursor:pointer}
.rm::after{content:'';position:absolute;top:0;left:2px;border:5px solid #4cc9f0;border-left-width:8px;border-right-color:transparent;border-top-color:transparent;border-bottom-color:transparent;transform:translateY(-1px)}
.trow.fold .clip{top:2px;bottom:2px;padding:0;pointer-events:none;opacity:.7;border-radius:3px}
.trow.fold .clip>*{display:none}
.tlab.fold{font-size:9px}.tlab.fold .ic .wn{display:none}
.asset{position:relative}
.xdel{position:absolute;top:4px;right:4px;z-index:3;all:unset;position:absolute;top:4px;right:4px;z-index:3;min-width:20px;height:20px;line-height:20px;text-align:center;border-radius:10px;background:rgba(0,0,0,.65);color:#fff;font-size:13px;cursor:pointer;opacity:0;transition:opacity .12s;padding:0 4px;box-sizing:border-box}
.asset:hover .xdel,.xdel:focus-visible,.xdel.arm{opacity:1}
.xdel:hover{background:#d23a3a}.xdel.arm{background:#d23a3a;font-size:11px;white-space:nowrap}
.xdel2{all:unset;cursor:pointer;margin-left:6px;width:20px;height:20px;line-height:20px;text-align:center;border-radius:10px;color:var(--mut);flex:none;opacity:.6;font-size:13px}
.xdel2:hover{background:#d23a3a;color:#fff;opacity:1}.xdel2.arm{background:#d23a3a;color:#fff;opacity:1;width:auto;padding:0 6px;font-size:11px}
.assets.stk .asset img{object-fit:contain;background:repeating-conic-gradient(#2b2942 0 25%,#232136 0 50%) 0 0/14px 14px}
#tlMarq{position:absolute;z-index:9;border:1px dashed #8f7bff;background:rgba(143,123,255,.16);pointer-events:none}
.clip.mq{outline:2px solid #8f7bff}
#freeze,#detach{display:none}
#hoverPrev{position:fixed;z-index:80;left:0;top:0;width:332px;padding:6px;background:#1c1a29;border:1px solid #4a4666;border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.55);pointer-events:none;opacity:0;transform:scale(.96);transition:opacity .12s,transform .12s;visibility:hidden}
#hoverPrev.on{opacity:1;transform:none;visibility:visible}
#hoverPrev .hp-body{display:flex;align-items:center;justify-content:center;min-height:90px;max-height:300px;background:#0e0d14;border-radius:8px;overflow:hidden}
#hoverPrev img,#hoverPrev video,#hoverPrev canvas{display:block;max-width:100%;max-height:300px;width:auto;height:auto}
#hoverPrev .hp-cap{font-size:12px;color:var(--mut);padding:6px 4px 2px;line-height:1.4}
#hoverPrev .hp-emoji{font-size:120px;line-height:1.3;padding:8px}
#hoverPrev .hp-text{padding:30px 16px;width:100%;text-align:center;background:#3a3850}
#hoverPrev .hp-wave{width:100%;height:110px;display:flex;align-items:center;justify-content:center;font-size:46px;color:#8fe3b0}
#hoverPrev .hp-wave img{width:100%;height:100%;object-fit:fill}
.ctxbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ctxbar:not(:empty)::before{content:'';width:1px;height:18px;background:var(--line);margin:0 2px}
#pvStop{position:fixed;left:16px;bottom:16px;z-index:60;background:#ff6b3d;color:#fff;border-color:#ff6b3d;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.btn.on{background:rgba(143,123,255,.28);border-color:#8f7bff}
.cxsel{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:3px 4px;font-size:12px;max-width:92px}
.tick{position:absolute;top:0;height:100%;border-left:1px solid #46435f;padding:6px 0 0 4px;font:10px var(--mono);color:var(--mut);pointer-events:none}
.trow{height:34px;border-bottom:1px solid var(--line);position:relative;background:repeating-linear-gradient(90deg,transparent 0 79px,rgba(255,255,255,.025) 79px 80px)}
.clip{position:absolute;top:3px;bottom:3px;border-radius:5px;overflow:hidden;cursor:grab;display:flex;align-items:center;padding:0 10px;font-size:12px;color:#fff;border:1px solid rgba(255,255,255,.18);user-select:none;touch-action:none;background-color:var(--c-video)}
.clip:active{cursor:grabbing}
.clip.t-video{background-color:var(--c-video)}
.clip.t-image{background-color:var(--c-image)}
.clip.t-text{background-color:var(--c-text)}
.clip.t-sticker{background-color:var(--c-sticker)}
.clip.t-shape{background-color:var(--c-shape)}
.clip.t-audio{background-color:var(--c-audio)}
.clip.t-toon{background-color:var(--c-toon)}
.clip.has-wave{padding-left:10px}
.clip .bt{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.55);pointer-events:none;z-index:1}
.clip .trk{position:absolute;left:2px;top:0;font-style:normal;font-size:11px;color:#fff;z-index:3;text-shadow:0 1px 2px #000;pointer-events:none}
.beatlines{position:absolute;left:0;right:0;top:26px;bottom:0;pointer-events:none;z-index:1}
.beatlines i{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,107,61,.16)}
.arow{display:flex;align-items:center;gap:8px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);cursor:pointer}
.arow:hover{border-color:var(--acc)}
.arow .ainfo{display:grid;min-width:0;flex:1;line-height:1.3}
.arow .ainfo b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .ainfo span{font-size:11px;color:var(--mut)}
.arow .plus{color:var(--mut);font-size:16px}
.toongrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.toon{background:var(--stage);border:1px solid var(--line);border-radius:8px;cursor:pointer;display:grid;justify-items:center;padding:4px 4px 6px;gap:2px;min-width:0}
.toon:hover{border-color:var(--acc)}
.toon canvas{width:100%;height:auto;aspect-ratio:132/100}
.toon span{font-size:12px}
.combo{display:grid;text-align:left;gap:1px;white-space:normal}
.combo small{color:var(--mut);font-size:11px}
.clip.has-thumb{background-size:auto 100%;background-repeat:repeat-x;background-blend-mode:multiply}
.clip.sel{outline:2px solid #fff;outline-offset:-1px;z-index:2;border-color:transparent}
.clip .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.8);pointer-events:none;position:relative;z-index:1}
.clip .h{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize;background:rgba(255,255,255,.0);z-index:3}
.clip .h.l{left:0}.clip .h.r{right:0}
.clip.sel .h{background:rgba(255,255,255,.35)}
.clip .bds{margin-left:auto;display:flex;gap:3px;padding-left:6px;pointer-events:none;position:relative;z-index:1}
.clip .bd{font-style:normal;font-size:10px;background:rgba(0,0,0,.45);border-radius:3px;padding:0 3px}
.clip .zin,.clip .zout{position:absolute;top:0;bottom:0;pointer-events:none;z-index:0}
.clip .zin{left:0;background:linear-gradient(90deg,rgba(255,255,255,.28),transparent)}
.clip .zout{right:0;background:linear-gradient(270deg,rgba(255,255,255,.28),transparent)}
.kfd{position:absolute;bottom:2px;width:8px;height:8px;margin-left:-4px;background:var(--acc);border:1px solid #fff;transform:rotate(45deg);pointer-events:none;z-index:2}
.ph{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--acc);z-index:5;pointer-events:none;will-change:transform}
.ph::before{content:"";position:absolute;top:0;left:-7px;width:12px;height:12px;background:var(--acc);clip-path:polygon(0 0,100% 0,50% 100%)}

/* 导出弹层 */
.modal{position:fixed;inset:0;background:rgba(8,7,12,.78);display:grid;place-items:center;z-index:50;padding:16px}
.modal .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;width:min(560px,100%);max-height:100%;overflow:auto;display:grid;gap:12px}

.modal .card.wide{width:min(1180px,100%)}
#segUI{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
@media(max-width:820px){#segUI{grid-template-columns:1fr}}
.segStage{position:relative;background:repeating-conic-gradient(#2a2838 0 25%,#222030 0 50%) 0 0/18px 18px;border-radius:8px;overflow:hidden;display:grid;place-items:center;max-height:68vh}
.segStage canvas{max-width:100%;max-height:68vh;width:auto;height:auto;display:block;touch-action:none}
#segBusy{position:absolute;inset:0;background:rgba(8,7,12,.7);place-items:center;color:#fff;font-size:14px;text-align:center;padding:12px}
.segSide{display:grid;gap:8px;max-height:68vh;overflow:auto;align-content:start}
.seg-tools{display:flex;gap:6px;flex-wrap:wrap}
#segList{display:grid;gap:4px;max-height:210px;overflow:auto}
.segRow{display:flex;align-items:center;gap:6px;padding:3px 5px;border:1px solid var(--line);border-radius:6px;cursor:pointer}
.segRow.act{border-color:var(--accent,#ff5d8f);background:rgba(255,93,143,.12)}
.segRow canvas{width:40px;height:40px;object-fit:contain;background:repeating-conic-gradient(#3a3850 0 25%,#2b2940 0 50%) 0 0/8px 8px;border-radius:4px}
.segName{flex:1;min-width:0;background:transparent;border:0;color:inherit;font:inherit;font-size:12px}
.modal h2{margin:0;font:400 20px var(--display)}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc)}
.modal video{width:100%;max-height:52vh;background:#000;border-radius:8px}

<script>
(()=>{
'use strict';
/* ───────── 基础 ───────── */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,9);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const cl01=v=>clamp(v,0,1);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MAINROW=0;  // 行号：主画面=0，叠加轨在上(1,2,3…)，音频轨在下(-1,-2,…)
const ASPECTS={'16:9':[1280,720],'9:16':[720,1280],'1:1':[960,960]};
const S={proj:{aspect:'16:9',bg:'#14131b',rowv:2,tracks:{}},clips:[],assets:[],sel:null,multi:[],t:0,playing:false,pps:90,tab:'basic',lib:'media'};
const RT=new Map();          // 片段运行时：video 元素、文字排版缓存
const IMG=new Map();         // 图片素材元素
let dirty=true,fontEpoch=0,lastDraw=-1;

const cv=$('#cv'),ov=$('#ov'),octx=ov.getContext('2d');let ctx=cv.getContext('2d');
const dims=()=>({W:cv.width,H:cv.height});
const asset=id=>S.assets.find(a=>a.id===id);
const sel=()=>S.clips.find(c=>c.id===S.sel)||null;
const selIds=()=>{const m=S.multi;if(m&&m.length>1&&S.sel&&m.includes(S.sel)){const ok=m.filter(id=>S.clips.some(c=>c.id===id));if(ok.length>1)return ok}return S.sel?[S.sel]:[]};
const isSel=id=>selIds().includes(id);
const selClips=()=>{const ids=selIds();return S.clips.filter(c=>ids.includes(c.id))};
const isMulti=()=>selIds().length>1;
const totalDur=()=>S.clips.reduce((m,c)=>Math.max(m,c.start+c.dur),0);

function toast(msg){
  const el=document.createElement('div');el.className='toast';el.textContent=msg;el.setAttribute('role','status');
  $('#toastHost').replaceChildren(el);clearTimeout(toast.t);toast.t=setTimeout(()=>el.remove(),3200);
}

/* ───────── 缓动 ───────── */
const EASE={
  linear:t=>t,
  smooth:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  out:t=>1-Math.pow(1-t,3),
  back:t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)},
  bounce:t=>{const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d)return n*(t-=1.5/d)*t+.75;if(t<2.5/d)return n*(t-=2.25/d)*t+.9375;return n*(t-=2.625/d)*t+.984375},
  elastic:t=>t<=0?0:t>=1?1:Math.pow(2,-10*t)*Math.sin((t*10-.75)*(2*Math.PI/3))+1
};
const EASE_NAMES={smooth:'平滑',out:'减速',back:'回弹',bounce:'弹跳',elastic:'弹簧',linear:'匀速'};
const hash=n=>{const x=Math.sin(n*12.9898)*43758.5453;return x-Math.floor(x)};

/* ───────── 动画预设 ───────── */
// 入场/出场共用：p 从 0（隐藏）到 1（静止），出场时倒过来用
const ENTER={
  fade:{n:'淡入淡出',f:(p,m)=>{m.o*=cl01(p)}},
  pop:{n:'弹出',f:(p,m)=>{m.s*=Math.max(0,p);m.o*=cl01(p*4)}},
  zoom:{n:'放大',f:(p,m)=>{m.s*=1+(1-p)*1.3;m.o*=cl01(p*1.6)}},
  left:{n:'左滑',f:(p,m)=>{m.dx-=(1-p)*1.1}},
  right:{n:'右滑',f:(p,m)=>{m.dx+=(1-p)*1.1}},
  up:{n:'上滑',f:(p,m)=>{m.dy-=(1-p)*1.1}},
  down:{n:'下滑',f:(p,m)=>{m.dy+=(1-p)*1.1}},
  spin:{n:'旋转',f:(p,m)=>{m.r-=(1-p)*540;m.s*=Math.max(0,p);m.o*=cl01(p*3)}},
  drop:{n:'掉落',f:(p,m)=>{m.dy-=(1-p)*1.0;m.o*=cl01(p*6)}},
  flip:{n:'翻转',f:(p,m)=>{m.sx*=Math.max(.001,p);m.o*=cl01(p*3)}},
  blur:{n:'模糊',f:(p,m)=>{m.blur=Math.max(0,(1-p)*26);m.o*=cl01(p*2)}},
  wipe:{n:'擦除',f:(p,m)=>{m.wipe=cl01(p)}},
  glitch:{n:'故障',f:(p,m,c,t)=>{const q=1-cl01(p);if(q<=0)return;const h=hash(Math.floor(t*24));m.dx+=(h-.5)*.12*q;m.sx*=1+(hash(Math.floor(t*24)+7)-.5)*.3*q;m.o*=h>.25?1:.25}},
  type:{n:'打字机',only:'text',g:(p,i,n,g)=>{g.vis=i<Math.ceil(cl01(p)*n-1e-6)}},
  wavein:{n:'逐字弹出',only:'text',g:(p,i,n,g)=>{const q=cl01((p*(n+2)-i)/2);g.s*=EASE.back(q);g.dy+=(1-q)*-.9*40;g.o*=cl01(q*3)}}
  ,pageL:{n:'翻页·左',f:(p,m)=>{m.page={p:cl01(p),dir:'L'}}},
  pageR:{n:'翻页·右',f:(p,m)=>{m.page={p:cl01(p),dir:'R'}}},
  pageU:{n:'翻页·上',f:(p,m)=>{m.page={p:cl01(p),dir:'U'}}},
  blinds:{n:'百叶窗',f:(p,m)=>{m.blinds=cl01(p)}},
  iris:{n:'圆形扩散',f:(p,m)=>{m.iris=cl01(p)}},
  blow:{n:'风吹',only:'text',g:(p,i,n,g)=>{const d=hash(i+1),q=cl01((1-p)*1.7-d*.7);g.dx+=q*q*(260+d*340);g.dy+=-q*(50+d*120)+Math.sin(q*9+i)*14*q;g.rot+=q*(2+d*4);g.o*=1-q;g.s*=1-q*.35}}
};
const LOOP={
  pulse:{n:'呼吸',f:(t,m)=>{m.s*=1+Math.sin(t*3)*.06}},
  wobble:{n:'摇摆',f:(t,m)=>{m.r+=Math.sin(t*4)*6}},
  heart:{n:'心跳',f:(t,m)=>{const k=(t*1.6)%1;const v=k<.12?k/.12*.2:k<.25?(1-(k-.12)/.13)*.2:k<.4?(k-.25)/.15*.12:k<.55?(1-(k-.4)/.15)*.12:0;m.s*=1+v}},
  float:{n:'漂浮',f:(t,m)=>{m.dy+=Math.sin(t*2)*.022;m.dx+=Math.cos(t*1.3)*.008;m.r+=Math.sin(t*1.5)*2}},
  spin:{n:'旋转',f:(t,m)=>{m.r+=t*90}},
  shake:{n:'抖动',f:(t,m)=>{m.dx+=Math.sin(t*60)*.006;m.dy+=Math.cos(t*47)*.006}},
  blink:{n:'闪烁',f:(t,m)=>{m.o*=Math.sin(t*8)>-.3?1:.12}},
  bounce:{n:'弹跳',f:(t,m)=>{const k=(t*2)%1,h=Math.abs(Math.sin(k*Math.PI));m.dy-=h*.07;m.sy*=1-(1-h)*.08;m.sx*=1+(1-h)*.05}},
  jelly:{n:'果冻',f:(t,m)=>{const w=Math.sin(t*7);m.sx*=1+w*.07;m.sy*=1-w*.07}},
  rainbow:{n:'变色',f:(t,m)=>{m.hue=(t*120)%360}},
  wave:{n:'波浪字',only:'text',g:(t,i,n,g)=>{g.dy+=Math.sin(t*6-i*.7)*12}},
  rainbowtext:{n:'彩虹字',only:'text',g:(t,i,n,g)=>{g.hue=(t*140+i*38)%360}}
};
/* ───────── 运动轨迹：让整个元素沿一条路线走 ───────── */
const PATHS={
  orbit:{n:'绕中心旋转',amp:20,cycles:1,hint:'绕画面中心（可改圆心）转圈'},
  circle:{n:'原地画圆',amp:12,cycles:2},
  s:{n:'S 形穿过',amp:14,cycles:1,len:70},
  wave:{n:'波浪前进',amp:8,cycles:3,len:70},
  eight:{n:'8 字',amp:16,cycles:1},
  spiral:{n:'螺旋飞出',amp:30,cycles:2},
  zig:{n:'折线下落',amp:12,cycles:3,len:50},
  pingpong:{n:'左右往返',amp:20,cycles:2},
  updown:{n:'上下往返',amp:12,cycles:2},
  fly:{n:'直线飞过',amp:0,cycles:1,len:90},
  arc:{n:'抛物跳跃',amp:20,cycles:2,len:70},
  heart:{n:'爱心轨迹',amp:14,cycles:1}
};
const tri=x=>Math.asin(Math.sin(x*2*Math.PI))*2/Math.PI;
function pathOff(c,lt,b){
  const p=c.path,{W,H}=dims(),u=cl01(lt/Math.max(.01,c.dur)),dir=p.dir===-1?-1:1,cy=p.cycles||1;
  const th=2*Math.PI*u*cy*dir,R=(p.amp==null?20:p.amp)/100*W,L=(p.len==null?70:p.len)/100,asp=W/H;
  let dx=0,dy=0,r=0;
  switch(p.kind){
    case'orbit':{
      const cx=(p.cx==null?50:p.cx)/100*W,cyy=(p.cy==null?50:p.cy)/100*H;
      let vx=b.x*W-cx,vy=b.y*H-cyy;
      if(Math.hypot(vx,vy)<8){vx=R;vy=0}
      const co=Math.cos(th),si=Math.sin(th);
      dx=(cx+vx*co-vy*si-b.x*W)/W;dy=(cyy+vx*si+vy*co-b.y*H)/H;
      if(p.spin)r=th*180/Math.PI;break}
    case'circle':dx=R*Math.cos(th)/W-R/W;dy=R*Math.sin(th)/H;if(p.spin)r=th*180/Math.PI;break;
    case's':case'wave':dx=(u-.5)*L*dir;dy=-Math.sin(u*2*Math.PI*cy)*R/H;break;
    case'eight':dx=Math.sin(th)*R/W;dy=Math.sin(2*th)*R/2/H;break;
    case'spiral':{const k=u,t2=2*Math.PI*cy*k*dir;dx=Math.sin(t2)*R*k/W;dy=-Math.cos(t2)*R*k/H+R*k/H;break}
    case'zig':dx=tri(u*cy)*R/W;dy=(u-.5)*L*asp;break;
    case'pingpong':dx=Math.sin(th)*R/W;break;
    case'updown':dy=Math.sin(th)*R/H;break;
    case'fly':{const a=(p.ang||0)*Math.PI/180;dx=(u-.5)*L*Math.cos(a)*dir;dy=(u-.5)*L*Math.sin(a)*asp*dir;break}
    case'arc':{const f=(u*cy)%1;dx=(u-.5)*L*dir;dy=-Math.sin(f*Math.PI)*R/H;break}
    case'heart':{const x=16*Math.pow(Math.sin(th),3),y=-(13*Math.cos(th)-5*Math.cos(2*th)-2*Math.cos(3*th)-Math.cos(4*th));dx=x/16*R/W;dy=(y+5)/16*R/H;break}
  }
  if(p.follow&&p.kind!=='orbit')r+=0;
  return{dx,dy,r};
}
const CAM={
  zin:{n:'缓慢推近',f:(p,m)=>{m.s*=1+.18*p}},
  zout:{n:'缓慢拉远',f:(p,m)=>{m.s*=1.18-.18*p}},
  panl:{n:'向左平移',f:(p,m)=>{m.s*=1.12;m.dx+=(.5-p)*.08}},
  panr:{n:'向右平移',f:(p,m)=>{m.s*=1.12;m.dx-=(.5-p)*.08}},
  hand:{n:'手持晃动',f:(p,m,c,t)=>{m.s*=1.05;m.dx+=Math.sin(t*2.3)*.006;m.dy+=Math.cos(t*1.9)*.006;m.r+=Math.sin(t*1.7)*.4}},
  slowspin:{n:'慢速旋转',f:(p,m,c)=>{m.r+=p*(c.dur*8)}}
};
const FILTERS={none:['原色',''],bw:['黑白','grayscale(1) contrast(1.1)'],retro:['复古','sepia(.65) contrast(1.05) saturate(1.2)'],vivid:['鲜艳','saturate(1.7) contrast(1.1)'],cool:['冷调','hue-rotate(185deg) saturate(.9) brightness(1.05)'],warm:['暖调','sepia(.35) saturate(1.4) hue-rotate(-12deg)'],film:['电影','contrast(1.2) saturate(.8) brightness(.92)'],blur:['朦胧','blur(6px) brightness(1.05)'],invert:['负片','invert(1)'],dream:['梦幻','saturate(1.3) brightness(1.1) blur(1.5px) hue-rotate(-20deg)']};

/* ───────── 片段数据 ───────── */
function newClip(type,o){
  return Object.assign({
    id:uid(),type,row:0,start:0,dur:3,x:.5,y:.5,s:1,r:0,o:1,
    anim:{in:null,out:null,loop:null,cam:null},
    ain:{dur:.7,ease:'back'},aout:{dur:.5,ease:'smooth'},aloop:{speed:1},
    kf:[],kfEase:'smooth',filter:'none',fit:'cover',speed:1,vol:1,srcIn:0,trans:null,beat:null,fadeIn:0,fadeOut:0,tspeed:1,flip:false,mask:null,deco:null
  },o);
}
const FONTS=[
  {id:'sans',n:'黑体',css:'"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif'},
  {id:'kuaile',n:'快乐体',css:'"ZCOOL KuaiLe","Noto Sans SC",sans-serif'},
  {id:'huangyou',n:'黄油体',css:'"ZCOOL QingKe HuangYou","Noto Sans SC",sans-serif'},
  {id:'brush',n:'毛笔字',css:'"Ma Shan Zheng","Noto Sans SC",serif'},
  {id:'serif',n:'宋体',css:'"Noto Serif SC","Songti SC",serif'}
];
function fontStr(c){
  const f=FONTS.find(x=>x.id===c.font)||FONTS[0];
  const w=f.id==='sans'?(c.bold?900:500):f.id==='serif'?700:400;
  return `${w} ${c.size}px ${f.css}`;
}
function loadFont(c){
  if(!document.fonts||!document.fonts.load)return Promise.resolve();
  return document.fonts.load(fontStr(c),c.text||'字').then(()=>{fontEpoch++;dirty=true}).catch(()=>{});
}

/* 关键帧：编辑位置/缩放/旋转/透明度时，已有关键帧的片段会自动记录 */
function baseT(c,lt){
  const k=c.kf;
  if(!k.length)return{x:c.x,y:c.y,s:c.s,r:c.r,o:c.o};
  const pick=o=>({x:o.x,y:o.y,s:o.s,r:o.r,o:o.o});
  if(lt<=k[0].t)return pick(k[0]);
  const last=k[k.length-1];
  if(lt>=last.t)return pick(last);
  let i=0;while(i<k.length-2&&k[i+1].t<=lt)i++;
  const a=k[i],b=k[i+1],u=(lt-a.t)/Math.max(1e-6,b.t-a.t),e=(EASE[b.ease]||EASE.smooth)(u);
  const L=(p,q)=>p+(q-p)*e;
  return{x:L(a.x,b.x),y:L(a.y,b.y),s:L(a.s,b.s),r:L(a.r,b.r),o:clamp(L(a.o,b.o),0,1)};
}
function setProps(c,o){
  if(!c.kf.length){Object.assign(c,o);return}
  const lt=clamp(S.t-c.start,0,c.dur);
  let k=c.kf.find(k=>Math.abs(k.t-lt)<.05);
  if(!k){const b=baseT(c,lt);k={t:+lt.toFixed(3),x:b.x,y:b.y,s:b.s,r:b.r,o:b.o,ease:c.kfEase};c.kf.push(k);c.kf.sort((a,b)=>a.t-b.t)}
  Object.assign(k,o);
}

/* ───────── 素材 ───────── */
function addImageAsset(file){
  const url=URL.createObjectURL(file);
  return new Promise(res=>{
    const im=new Image();
    im.onload=()=>{const a={id:uid(),kind:'image',name:file.name,url,w:im.naturalWidth,h:im.naturalHeight,thumb:url};IMG.set(a.id,im);S.assets.push(a);if(file.type==='image/gif'||file.type==='image/webp'){a.mime=file.type;decodeGif(a).then(ok=>{if(ok)renderLib()})}renderLib();dirty=true;res(a)};
    im.onerror=()=>{toast('这张图片读不出来，换 PNG 或 JPG 试试');res(null)};
    im.src=url;
  });
}
function addVideoAsset(file){
  const url=URL.createObjectURL(file);
  return new Promise(res=>{
    const v=document.createElement('video');v.preload='auto';v.muted=true;v.playsInline=true;v.src=url;

    const sa=(D/(D-u0*L*sn)+D/(D-u1*L*sn))/2,r=rect(a0,a1,sa);
    let sx,sy,sw,shh;
    if(!horiz){sw=iw/N;shh=ih;sy=0;sx=right?(1-u1)*iw:u0*iw}
    else{sw=iw;shh=ih/N;sx=0;sy=u0*ih}
    ctx.globalAlpha=ga;ctx.drawImage(src,sx,sy,sw,shh,r[0],r[1],r[2],r[3]);

}

/* ───────── 音频：解码、波形、节拍检测、示例音乐与音效 ───────── */
function analyzeBuffer(buf){
  const sr=buf.sampleRate,n=buf.length,c0=buf.getChannelData(0),c1=buf.numberOfChannels>1?buf.getChannelData(1):null;
  const NP=Math.max(200,Math.min(3000,Math.round(buf.duration*40))),bs=Math.max(1,Math.floor(n/NP)),peaks=new Float32Array(NP),step=Math.max(1,bs>>6);
  for(let i=0;i<NP;i++){let mx=0;const s=i*bs,e=Math.min(n,s+bs);for(let j=s;j<e;j+=step){const v=Math.abs(c1?(c0[j]+c1[j])/2:c0[j]);if(v>mx)mx=v}peaks[i]=mx}
  const hop=512,nb=Math.floor(n/hop),bl=new Float32Array(nb),bh=new Float32Array(nb),al=1-Math.exp(-2*Math.PI*160/sr);
  let y=0;
  for(let b=0;b<nb;b++){
    let el=0,eh=0;const s=b*hop;
    for(let j=s;j<s+hop;j++){const x=c1?(c0[j]+c1[j])/2:c0[j];y+=al*(x-y);el+=y*y;const h=x-y;eh+=h*h}
    bl[b]=el;bh[b]=eh;
  }
  const nf=Math.max(0,nb-1),envL=new Float32Array(nf),envH=new Float32Array(nf),flux=new Float32Array(nf);
  for(let i=0;i<nf;i++){envL[i]=Math.sqrt((bl[i]+bl[i+1])/(2*hop));envH[i]=Math.sqrt((bh[i]+bh[i+1])/(2*hop))}
  let mx=1e-9;
  for(let i=1;i<nf;i++){flux[i]=Math.max(0,envL[i]-envL[i-1])+.8*Math.max(0,envH[i]-envH[i-1]);if(flux[i]>mx)mx=flux[i]}
  for(let i=0;i<nf;i++)flux[i]/=mx;
  return{peaks,flux,hop,sr,dur:buf.duration};
}
function waveURL(peaks){
  const c=document.createElement('canvas'),Wd=peaks.length,Ht=44;c.width=Wd;c.height=Ht;
  const g=c.getContext('2d');let mx=1e-6;for(const p of peaks)if(p>mx)mx=p;
  g.fillStyle='rgba(255,255,255,.88)';
  for(let i=0;i<Wd;i++){const h=Math.max(2,peaks[i]/mx*Ht*.92);g.fillRect(i,(Ht-h)/2,1,h)}
  return c.toDataURL('image/png');
}
function pickOnsets(a,sens){
  const f=a.flux,hs=a.hop/a.sr,n=f.length;if(n<8)return[];
  const pre=new Float64Array(n+1),pre2=new Float64Array(n+1);
  for(let i=0;i<n;i++){pre[i+1]=pre[i]+f[i];pre2[i+1]=pre2[i]+f[i]*f[i]}
  const w=Math.max(8,Math.round(.6/hs)),k=2.6-2.0*sens,out=[];let lastT=-9,lastV=0;
  for(let i=2;i<n-2;i++){
    const lo=Math.max(0,i-w),hi=Math.min(n,i+w+1),cnt=hi-lo,mean=(pre[hi]-pre[lo])/cnt,vr=Math.max(0,(pre2[hi]-pre2[lo])/cnt-mean*mean),std=Math.sqrt(vr);
    const v=f[i];
    if(v<mean+k*std+.04)continue;
    if(v<f[i-1]||v<f[i+1]||v<f[i-2]||v<f[i+2])continue;
    const t=(i+1)*hs;
    if(t-lastT<.2){if(v>lastV){out[out.length-1]=t;lastT=t;lastV=v}continue}
    out.push(t);lastT=t;lastV=v;
  }
  return out;
}
function estimateTempo(a){
  const f=a.flux,hs=a.hop/a.sr,n=f.length;
  if(n<200)return{bpm:120,off:0,conf:0};
  const minL=Math.round(60/200/hs),maxL=Math.round(60/55/hs),sc=new Float64Array(maxL+2);
  let best=-1,bl=minL,sum=0,cnt=0;
  for(let L=minL;L<=maxL;L++){
    let s=0;for(let i=0;i+L<n;i++)s+=f[i]*f[i+L];s/=(n-L);
    const bpm=60/(L*hs),wt=Math.exp(-.5*Math.pow(Math.log2(bpm/118)/.85,2));
    sc[L]=s*wt;sum+=sc[L];cnt++;
    if(sc[L]>best){best=sc[L];bl=L}
  }
  let L=bl;
  const y0=sc[L-1]||sc[L],y1=sc[L],y2=sc[L+1]||sc[L],d=y0-2*y1+y2,sh=d!==0?.5*(y0-y2)/d:0;
  L+=clamp(sh,-.5,.5);

  const per=60/bpm,steps=96;let bo=0,bs=-1;
  for(let o=0;o<steps;o++){
    const off=per*o/steps;let s=0;
    for(let t=off;t<n*hs;t+=per){const i=Math.round(t/hs-1);let m=0;for(let q=-1;q<=1;q++){const v=f[i+q];if(v>m)m=v}s+=m}
    if(s>bs){bs=s;bo=off}
  }
  const ons=pickOnsets(a,.55);
  if(ons.length>=8){
    let bb=bpm,br=-1,bph=0;
    for(let k=-100;k<=100;k++){
      const cb=bpm*(1+k*.0002),p2=60/cb;let sr=0,si=0;
      for(const t of ons){const ph=2*Math.PI*t/p2;sr+=Math.cos(ph);si+=Math.sin(ph)}

  return{bpm,off:bo,conf:best/(sum/cnt+1e-9)};
}
function recomputeBeats(a){
  if(!a.flux){a.beats=[];return}
  if(a.mode==='grid'){const p=60/a.bpm,out=[];for(let t=a.off;t<a.dur-.05;t+=p)out.push(+t.toFixed(4));a.beats=out}
  else a.beats=pickOnsets(a,a.sens);

function fillAnalysis(a,an){
  a.wave=waveURL(an.peaks);a.flux=an.flux;a.hop=an.hop;a.sr=an.sr;
  if(!a.sfx){
    const tp=estimateTempo(an);a.bpm=+tp.bpm.toFixed(1);a.off=+tp.off.toFixed(3);a.mode='grid';a.sens=.5;
  }else{a.beats=[];a.mode='grid'}

function wavBlob(buf){
  const n=buf.length,sr=buf.sampleRate,ch=buf.getChannelData(0),ab=new ArrayBuffer(44+n*2),v=new DataView(ab);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  ws(0,'RIFF');v.setUint32(4,36+n*2,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){const x=clamp(ch[i],-1,1);v.setInt16(44+i*2,x<0?x*32768:x*32767,true)}
  return new Blob([ab],{type:'audio/wav'});

async function addAudioFromBuffer(name,buf,opt){
  const url=URL.createObjectURL(wavBlob(buf));
  const a={id:uid(),kind:'audio',name,url,w:0,h:0,dur:buf.duration,builtin:true,sfx:!!(opt&&opt.sfx)};
  fillAnalysis(a,analyzeBuffer(buf));
  if(opt&&opt.bpm&&!a.sfx){a.bpm=opt.bpm;a.off=opt.off||0;recomputeBeats(a)}
  S.assets.push(a);return a;
}
async function addAudioFile(file){
  const url=URL.createObjectURL(file);
  const a={id:uid(),kind:'audio',name:file.name,url,w:0,h:0,dur:0,sfx:false};
  let buf=null;
  try{ensureAC();if(AC){const ab=await file.arrayBuffer();buf=await AC.decodeAudioData(ab.slice(0))}}catch(e){buf=null}
  if(buf){a.dur=buf.duration;fillAnalysis(a,analyzeBuffer(buf))}
  else{
    a.dur=await new Promise(res=>{const el=document.createElement('audio');el.preload='metadata';el.src=url;el.onloadedmetadata=()=>res(el.duration||0);el.onerror=()=>res(0)});
    if(!a.dur){toast('这个音频格式读不出来，换 MP3 / WAV / M4A 试试');return null}
    a.beats=[];a.mode='grid';a.bpm=120;a.off=0;a.sens=.5;toast('音频已导入，但浏览器没能分析节拍');
  }
  S.assets.push(a);return a;

/* 用 OfflineAudioContext 合成示例音乐和音效（22.05kHz 单声道） */
function offline(dur){const C=window.OfflineAudioContext||window.webkitOfflineAudioContext;return new C(1,Math.ceil(dur*22050),22050)}

  const master=o.createGain();master.gain.value=.85;master.connect(o.destination);
  const kick=t=>{const os=o.createOscillator(),g=o.createGain();os.frequency.setValueAtTime(150,t);os.frequency.exponentialRampToValueAtTime(42,t+.12);g.gain.setValueAtTime(1,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);os.connect(g);g.connect(master);os.start(t);os.stop(t+.32)};
  const nz=(t,f,type,q,len,v)=>{const s=o.createBufferSource(),fl=o.createBiquadFilter(),g=o.createGain();s.buffer=nb;s.loop=true;fl.type=type;fl.frequency.value=f;fl.Q.value=q;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+len);s.connect(fl);fl.connect(g);g.connect(master);s.start(t);s.stop(t+len+.02)};
  const tone=(t,f,len,type,v,cut)=>{const os=o.createOscillator(),fl=o.createBiquadFilter(),g=o.createGain();os.type=type;os.frequency.value=f;fl.type='lowpass';fl.frequency.value=cut;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+len);os.connect(fl);fl.connect(g);g.connect(master);os.start(t);os.stop(t+len+.02)};

  for(let b=0;b<bars*4;b++){

    if(bar>=1)for(let s=0;s<2;s++)tone(t+s*beat/2,lead[(b*2+s)%8]*(kind==='b'?2:1),beat*.42,'square',.13,2600);

  else{len=2.7;const {s,fl}=src(700,'bandpass',.9),g=o.createGain(),lfo=o.createOscillator(),lg=o.createGain();lfo.frequency.value=.9;lg.gain.value=320;lfo.connect(lg);lg.connect(fl.frequency);g.gain.setValueAtTime(.0001,0);g.gain.linearRampToValueAtTime(.9,1);g.gain.linearRampToValueAtTime(.0001,2.6);fl.connect(g);g.connect(m);s.start(0);s.stop(2.7);lfo.start(0);lfo.stop(2.7)}

/* ───────── 历史记录 ───────── */
const HI={stack:[],idx:-1};
const snap=()=>JSON.stringify({proj:S.proj,clips:S.clips});
let histHook=null;
function pushHist(){
  const s=snap();if(HI.stack[HI.idx]===s)return;
  HI.stack=HI.stack.slice(0,HI.idx+1);HI.stack.push(s);
  if(HI.stack.length>60)HI.stack.shift();HI.idx=HI.stack.length-1;histBtns();
  if(histHook)histHook();
}
function restore(s){
  const o=JSON.parse(s);S.proj=o.proj;S.clips=o.clips;
  for(const id of [...RT.keys()])if(!S.clips.some(c=>c.id===id))dropRT(id);
  if(S.sel&&!sel())S.sel=null;
  applyAspect();$('#aspect').value=S.proj.aspect;$('#bgcolor').value=S.proj.bg;
  S.clips.forEach(c=>{if(c.type==='text')loadFont(c)});
  everything();histBtns();
  if(histHook)histHook();
}
function undo(){if(HI.idx>0){HI.idx--;restore(HI.stack[HI.idx])}}
function redo(){if(HI.idx<HI.stack.length-1){HI.idx++;restore(HI.stack[HI.idx])}}
function histBtns(){$('#undo').disabled=HI.idx<=0;$('#redo').disabled=HI.idx>=HI.stack.length-1}
function everything(){renderTimeline();renderInspector();dirty=true}

/* ───────── 播放 ───────── */
let clock0=0,t0=0,stopAt=0,onEnd=null;
function play(from,to,cb){
  const total=totalDur();if(total<=0){toast('先往时间轴里加点东西');return}
  ensureAC();if(AC&&AC.state==='suspended')AC.resume();
  if(typeof stopPreview==='function'&&pvId)stopPreview();
  if(from!=null)S.t=from;
  stopAt=to!=null?Math.min(to,total):total;
  if(S.t>=stopAt-.01)S.t=0;
  S.playing=true;clock0=performance.now();t0=S.t;onEnd=cb||null;dirty=true;updatePlayBtn();
}
function pause(){
  if(!S.playing)return;
  S.playing=false;syncMedia(S.t,false);updatePlayBtn();dirty=true;
  const f=onEnd;onEnd=null;if(f)f();
}
function seek(t){S.t=clamp(t,0,Math.max(totalDur(),0));if(S.playing)pause();syncMedia(S.t,false);dirty=true}
function updatePlayBtn(){const b=$('#play');b.textContent=S.playing?'⏸':'▶';b.setAttribute('aria-label',S.playing?'暂停':'播放')}
const fmt=t=>{t=Math.max(0,t);const m=Math.floor(t/60),s=t-m*60;return String(m).padStart(2,'0')+':'+s.toFixed(2).padStart(5,'0')};
let lastUI=0,lastGC=0,OVC=false;
let LASTRAF=0,EXPTRACK=null;
function tick(now){
  requestAnimationFrame(tick);LASTRAF=performance.now();
  try{
    if(now-lastGC>600&&!S.exporting){lastGC=now;gcMedia(S.t)}
    if(S.playing){
      S.t=t0+(now-clock0)/1000;
      if(S.t>=stopAt){S.t=stopAt;pause()}
    }
    if(FASTEXP)return;
    if(S.playing||dirty||lastDraw!==S.t){
      lastDraw=S.t;dirty=false;
      syncMedia(S.t,S.playing);renderFrame();
      if(EXPTRACK)try{EXPTRACK.requestFrame()}catch(e){}
      if(S.playing){if(!OVC){octx.clearRect(0,0,ov.width,ov.height);OVC=true}}else{OVC=false;drawOverlay()}
      $('#timeLbl').innerHTML=`${fmt(S.t)} <i>/ ${fmt(totalDur())}</i>`;
      const ph=$('#ph');if(ph)ph.style.transform=`translateX(${S.t*S.pps}px)`;
      if(S.playing){
        const sc=$('#tlScroll'),x=S.t*S.pps;
        if(x>sc.scrollLeft+sc.clientWidth-40)sc.scrollLeft=x-40;
        if(S.exporting)exportProgress();
      }
      if(now-lastUI>120){lastUI=now;syncTransformFields()}
    }
    if(S.lib==='toon')toonTiles(now);
  }catch(e){console.error(e)}
}

/* ───────── 添加内容 ───────── */
function rowFree(row,start,dur,ignore){
  return !S.clips.some(c=>c.id!==ignore&&c.row===row&&start<c.start+c.dur-1e-6&&start+dur>c.start+1e-6);
}
function rowEnd(row){return S.clips.filter(c=>c.row===row).reduce((m,c)=>Math.max(m,c.start+c.dur),0)}
let FORCE=null;
const rowOk=(c,r)=>c.type==='audio'?r<0:r>=0;
function newRowFor(audio){
  const rs=S.clips.map(x=>x.row);
  return audio?Math.min(-1,...rs)-1:Math.max(0,...rs)+1;
}
function place(c,rows){
  if(FORCE&&FORCE.row!=null&&rowOk(c,FORCE.row)&&rowFree(FORCE.row,c.start,c.dur)){c.row=FORCE.row;return}
  for(const r of rows)if(rowFree(r,c.start,c.dur)){c.row=r;return}
  c.row=newRowFor(rows[0]<0);   // 没有空位就新开一条轨道
}
function addClip(c,rows){
  place(c,rows);S.clips.push(c);S.sel=c.id;
  if(c.type==='text')loadFont(c);
  seek(c.start+Math.min(.01,c.dur/2));
  pushHist();everything();
  return c;
}
/* 主画面轨插入：在 t 处插入，必要时把所在片段劈开，后面的片段整体后移 */
let LASTADD=null;
function insertMain(c,t){
  const rowC=S.clips.filter(x=>x.row===0);
  if(LASTADD&&Math.abs(S.t-LASTADD.t)<1e-6){const lx=rowC.find(x=>x.id===LASTADD.id);if(lx)t=lx.start+lx.dur}
  for(const x of rowC){if(Math.abs(t-x.start)<.08)t=x.start;else if(Math.abs(t-(x.start+x.dur))<.08)t=x.start+x.dur}
  const end=rowC.reduce((m,x)=>Math.max(m,x.start+x.dur),0);
  if(Math.abs(t-end)<.15)t=end;
  for(const x of rowC){if(t>x.start+.05&&t<x.start+x.dur-.05){splitClipAt(x,t);break}}
  const hit=S.clips.some(x=>x.row===0&&t>=x.start-1e-6&&t<x.start+x.dur-1e-6);
  if(hit||S.clips.some(x=>x.row===0&&x.start>=t-1e-6&&x.start<t+c.dur-1e-6)){
    S.clips.forEach(x=>{if(x.row===0&&x.start>=t-1e-6)x.start+=c.dur});
  }
  c.start=t;c.row=0;
}
function addMedia(a,overlay,opt){
  opt=opt||{};
  const dur=a.kind==='video'?a.dur:4,t=opt.t!=null?opt.t:S.t;
  if(opt.row!=null&&opt.row>0)overlay=true;
  const c=newClip(a.kind,{asset:a.id,dur,fit:overlay?'contain':'cover'});
  if(overlay){
    c.start=t;c.fit='cover';c.s=.4;c.x=.78;c.y=.76;c.deco={rad:28,bw:6,bc:'#ffffff',sh:true};
    if(opt.x!=null){c.x=opt.x;c.y=opt.y}
    const rows=opt.row!=null&&opt.row>0?[opt.row,1,2,3]:[1,2,3];place(c,rows);
  }else insertMain(c,t);
  S.clips.push(c);
  S.sel=c.id;seek(c.start+.01);LASTADD=overlay?null:{id:c.id,t:S.t};pushHist();everything();
  toast(overlay?'已叠加到播放头位置':'已插入到播放头位置，后面的片段自动后移');
}

const RULER=26,ROWH=34;
function tlRowList(){
  const rs=S.clips.map(x=>x.row);for(const k in (S.proj.tracks||{}))if(trackBusy(+k))rs.push(+k);
  const top=Math.max(3,...rs.map(r=>r+1)),bot=Math.min(-2,...rs.map(r=>r-1));
  const out=[];for(let r=top;r>=bot;r--)out.push(r);return out;
}

function onDrag(e){
  if(!drag)return;
  const rect=$('#tlInner').getBoundingClientRect();
  if(drag.mode==='seek'){seek((e.clientX-rect.left)/S.pps);return}
  if(drag.mode==='marq'){marqMove(e);return}
  const c=drag.c,dt=(e.clientX-drag.x0)/S.pps;
  if(Math.abs(e.clientX-drag.x0)>2)drag.moved=true;
  if(!drag.moved)return;
  if(drag.mode==='move'){
    let st=Math.max(0,drag.start0+dt);
    const s1=snapT(c,st,c.id),s2=snapT(c,st+c.dur,c.id)-c.dur;
    st=Math.abs(s1-st)<=Math.abs(s2-st)?s1:s2;st=Math.max(0,st);
    if(drag.grp&&drag.grp.length>1){
      const sh=Math.max(st-drag.start0,-Math.min(...drag.grp.map(g=>g.start0))),ids=new Set(drag.grp.map(g=>g.c.id));
      const ok=drag.grp.every(g=>{const ns=g.start0+sh;return !S.clips.some(o=>!ids.has(o.id)&&o.row===g.c.row&&ns<o.start+o.dur-1e-6&&ns+g.c.dur>o.start+1e-6)});
      if(ok)for(const g of drag.grp){g.c.start=g.start0+sh;layoutClipEl(g.c)}
      dirty=true;return;
    }
    const rl=drag.rl||(drag.rl=tlRowList()),row=rowAtY(c,e.clientY-rect.top,rl);
    if(drag.nb&&row===c.row)c.start=st;
    else if(rowFree(row,st,c.dur,c.id)){c.row=row;c.start=st}
    else if(rowFree(c.row,st,c.dur,c.id))c.start=st;
  }else if(drag.mode==='trimR'){
    let end=snapT(c,drag.start0+drag.dur0+dt,c.id),d=Math.max(.1,end-c.start);
    const nxt=S.clips.filter(o=>o.id!==c.id&&o.row===c.row&&o.start>=c.start+.001).reduce((m,o)=>Math.min(m,o.start),Infinity);
    if(!drag.nb)d=Math.min(d,nxt-c.start);
    if(c.type==='video'){const a=asset(c.asset);d=Math.min(d,(a.dur-c.srcIn)/c.speed)}
    c.dur=Math.max(.1,d);
  }else{
    let st=snapT(c,drag.start0+dt,c.id);
    const prv=S.clips.filter(o=>o.id!==c.id&&o.row===c.row&&o.start+o.dur<=drag.start0+.001).reduce((m,o)=>Math.max(m,o.start+o.dur),0);
    st=drag.nb?Math.max(st,0):Math.max(st,prv,0);
    const end=drag.start0+drag.dur0;st=Math.min(st,end-.1);
    let delta=st-drag.start0;
    if(c.type==='video'){const si=drag.srcIn0+delta*c.speed;if(si<0){delta=-drag.srcIn0/c.speed;st=drag.start0+delta}}
    c.start=st;c.dur=end-st;
    if(c.type==='video')c.srcIn=Math.max(0,drag.srcIn0+delta*c.speed);
    c.kf.forEach((k,i)=>{k.t=drag.kf0[i]-delta});
  }
  if(drag.nb)squeeze();
  layoutClipEl(c);dirty=true;
}
/* 挤压相邻字幕：被推到的邻居缩短（最短 0.3 秒），缩不动了就整体顺推 */
const SQ_MIN=.3;
const squeezeOn=r=>{const o=rowOpt(r);return o.squeeze!=null?!!o.squeeze:o.name==='字幕'};
function squeeze(){
  const c=drag.c,nb=drag.nb;
  const ok=c.row===drag.row;
  const R=nb.filter(x=>!x.left).sort((a,b)=>a.s0-b.s0),L=nb.filter(x=>x.left).sort((a,b)=>b.s0-a.s0);
  let lim=c.start+c.dur;
  for(const x of R){
    let ns=x.s0,ne=x.s0+x.d0;
    if(ok&&ns<lim){ns=lim;ne=Math.max(ne,ns+SQ_MIN)}
    x.o.start=ns;x.o.dur=ne-ns;lim=Math.max(lim,ne);layoutClipEl(x.o);
  }
  lim=c.start;
  for(const x of L){
    let ns=x.s0,ne=x.s0+x.d0;
    if(ok&&ne>lim){ne=lim;ns=Math.min(ns,ne-SQ_MIN);if(ns<0){ns=0;ne=Math.max(ne,SQ_MIN)}}
    x.o.start=ns;x.o.dur=ne-ns;lim=Math.min(lim,ns);layoutClipEl(x.o);
  }
}

function splitClipAt(c,t){
  const cut=t-c.start;if(cut<=.05||cut>=c.dur-.05)return null;
  const c2=JSON.parse(JSON.stringify(c));c2.id=uid();
  c2.start=t;c2.dur=c.dur-cut;
  if(c.type==='video'||c.type==='audio')c2.srcIn=c.srcIn+cut*c.speed;
  c.dur=cut;c.anim.out=null;c2.anim.in=null;c2.trans=null;
  c2.kf=c2.kf.map(k=>({...k,t:k.t-cut}));

}
function splitSel(){

    if(last)S.sel=last.id;S.multi=[];pushHist();everything();toast(`已在播放头处分割 ${n} 个片段`);return;
  }

    let blob=new Blob(chunks,{type});
    if(type.includes('webm')){const rt=(dbg.t1-dbg.t0)/1000-.35;blob=await fixWebmDuration(blob,!ctl.pauses&&rt>total*.8?Math.min(rt,total+1.5):total)}
    const ext=type.includes('mp4')?'mp4':'webm';
    const d=new Date(),pad=n=>String(n).padStart(2,'0');
    const name=`小剪动画-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.${ext}`;
    const url=URL.createObjectURL(blob);
    modal(`<h2>导出完成</h2><video controls src="${url}"></video><p class="tip">${ext.toUpperCase()} · ${(blob.size/1048576).toFixed(1)} MB · ${Math.ceil(total)} 秒</p><div class="row2"><button class="btn primary" id="expSave">保存视频</button><button class="btn" id="expClose" style="margin-left:auto">关闭</button></div>`);
    $('#expSave').onclick=()=>saveBlob(blob,name);
    $('#expClose').onclick=()=>modal('');
    window.__lastExport={size:blob.size,type,name};
  }catch(err){
    console.error(err);if(exportCtl&&exportCtl.cleanup)exportCtl.cleanup();EXPTRACK=null;S.exporting=false;modal('');toast('导出失败：'+(err&&err.message?err.message:'未知错误'));
  }
}

function markPreview(){
  $$('[data-prev]').forEach(x=>{const on=x.dataset.prev===String(pvId);x.textContent=on?'■':'▶';x.classList.toggle('on',on)});
  let bar=$('#pvStop');
  if(pvId&&!bar){bar=document.createElement('button');bar.id='pvStop';bar.className='btn sm';bar.textContent='■ 停止试听';bar.onclick=stopPreview;document.body.appendChild(bar)}

let lastTile=0;
function toonTiles(now){
  if(now-lastTile<70)return;lastTile=now;
  const cs=$$('#libBody canvas[data-tc]');if(!cs.length)return;
  const T=now/1000,hb=$('#libBody').getBoundingClientRect();
  for(const cvs of cs){
    const rc=cvs.getBoundingClientRect();if(rc.bottom<hb.top||rc.top>hb.bottom||rc.height===0)continue;
    const t=TOONS[cvs.dataset.tc],g=cvs.getContext('2d');
    g.clearRect(0,0,132,100);g.save();g.translate(66,50);
    const P={W:1280,H:720,k:1,color:t.color,label:t.label||'',x:0,y:0,vx:0,dur:4};
    const sc=t.full?.1:Math.min(120/t.w,90/t.h);
    g.scale(sc,sc);g.lineJoin='round';g.lineCap='round';
    if(t.prev)t.prev(P,T);
    const tt=(t.id==='arrow'||t.id==='boom'||t.id==='speech')?T%3:T,u=t.id==='hand'?(T%3)/3:(T%4)/4;
    try{t.draw(g,tt,u,P)}catch(e){}
    g.restore();
  }
}

function autoCut(ac){
  const B=beatsOf(ac);
  if(B.length<2){toast('这段音频里没有可用的鼓点');return}
  const t0=ac.start,t1=ac.start+ac.dur,ev=AC_OPT.every;
  const cuts=[t0];
  B.filter((_,i)=>i%ev===0).forEach(t=>{if(t>t0+.25&&t<t1-.25&&t-cuts[cuts.length-1]>=.3)cuts.push(t)});
  cuts.push(t1);
  let pool=S.clips.filter(x=>x.row===0&&isMedia(x)).sort((p,q)=>p.start-q.start).map(x=>({type:x.type,asset:x.asset,srcIn:x.srcIn}));
  if(!pool.length){
    const own=S.assets.filter(x=>(x.kind==='image'||x.kind==='video')&&!x.builtin),src=own.length?own:S.assets.filter(x=>x.kind==='image');
    pool=src.map(x=>({type:x.kind,asset:x.id,srcIn:0}));
  }
  if(!pool.length){toast('先导入一些视频或图片');return}
  S.clips=S.clips.filter(x=>{if(x.row!==0||!isMedia(x))return true;const ov=x.start<t1&&x.start+x.dur>t0;if(ov)dropRT(x.id);return!ov});
  const styles={cut:[],zoom:['zoom'],slide:['left','right','up','down'],spin:['spin','zoom'],wipe:['wipe','blinds','iris'],mix:['zoom','left','wipe','blur','flip','right','iris','spin'],page:['pageL','pageR','pageU']};
  const list=styles[AC_OPT.style]||[],vpos={};
  for(let i=0;i<cuts.length-1;i++){
    const st=cuts[i],dur=cuts[i+1]-st,it=pool[i%pool.length];
    const c=newClip(it.type,{asset:it.asset,row:0,start:st,dur,fit:'cover'});
    if(it.type==='video'){
      const a2=asset(it.asset);let si=vpos[it.asset]!=null?vpos[it.asset]:it.srcIn;
      if(si+dur>a2.dur-.05)si=0;c.srcIn=si;vpos[it.asset]=si+dur;
    }
    if(it.type==='image'&&AC_OPT.style!=='page'&&AC_OPT.style!=='cut')c.anim.cam=i%2?'zout':'zin';
    if(AC_OPT.style==='page'){if(i>0)c.trans={type:list[i%3],dur:Math.min(.5,dur*.7),ease:'smooth'}}
    else if(list.length){c.anim.in=list[i%list.length];c.ain={dur:Math.min(.32,dur*.6),ease:'out'}}
    if(AC_OPT.beat)c.beat={kind:'pulse',amt:.7,decay:7};
    S.clips.push(c);
  }
  S.sel=ac.id;S.t=t0;pushHist();everything();
  toast(`已按节拍切成 ${cuts.length-1} 段`);
  play(t0,t0+Math.min(6,ac.dur));
}
function splitAtBeats(c){
  const ev=+($('#bsEvery')?$('#bsEvery').value:2);

  let cur=c;for(const t of B){const n=splitClipAt(cur,t);if(n)cur=n}
  pushHist();everything();toast(`已在 ${B.length} 个鼓点处切开`);
}

/* 定格 */
function pickVideoAtPlayhead(){
  const c=sel();
  if(c&&c.type==='video'&&S.t>=c.start&&S.t<c.start+c.dur)return c;
  const l=S.clips.filter(x=>x.type==='video'&&S.t>=x.start&&S.t<x.start+x.dur).sort((p,q)=>p.row-q.row);
  return l[0]||null;
}
async function freezeFrame(c,dur){
  c=c&&c.type==='video'?c:pickVideoAtPlayhead();
  if(!c){toast('先把播放头移到一段视频上，再点定格');return}
  const t=S.t;
  if(t<c.start-1e-6||t>c.start+c.dur+1e-6){toast('播放头不在这段视频里');return}
  dur=dur||S.frz||2;
  pause();
  const a=asset(c.asset),lt=clamp(t-c.start,0,c.dur),v=vEl(c),target=c.srcIn+lt*c.speed;
  if(Math.abs(v.currentTime-target)>.03||v.seeking||v.readyState<2){
    await new Promise(res=>{const f=()=>{v.removeEventListener('seeked',f);res()};v.addEventListener('seeked',f);v.currentTime=target;setTimeout(res,1500)});
  }
  const mw=Math.min(1,1920/Math.max(a.w,a.h)),cw=Math.round(a.w*mw),ch=Math.round(a.h*mw);
  const cvs=document.createElement('canvas');cvs.width=cw;cvs.height=ch;
  try{cvs.getContext('2d').drawImage(v,0,0,cw,ch)}catch(e){toast('取不到这一帧');return}
  const url=cvs.toDataURL('image/jpeg',.93);
  const im=await new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=url});
  if(!im){toast('取不到这一帧');return}
  const fa={id:uid(),kind:'image',name:'定格 '+fmt(t).slice(0,8),url,w:cw,h:ch,thumb:url};
  IMG.set(fa.id,im);S.assets.push(fa);
  const b=baseT(c,lt);
  let at=t;
  if(lt<=.05)at=c.start;else if(lt>=c.dur-.05)at=c.start+c.dur;
  else{
    splitClipAt(c,t);
    // 同一素材分离出来的音频跟着劈开
    if(a.audioAsset)S.clips.filter(x=>x.type==='audio'&&x.asset===a.audioAsset&&t>x.start+.05&&t<x.start+x.dur-.05).forEach(x=>splitClipAt(x,t));
  }
  S.clips.forEach(x=>{
    if(x.row===c.row&&x.start>=at-1e-6)x.start+=dur;
    else if(a.audioAsset&&x.type==='audio'&&x.asset===a.audioAsset&&x.start>=at-1e-6)x.start+=dur;
  });
  const f=newClip('image',{asset:fa.id,row:c.row,start:at,dur,fit:c.fit,x:b.x,y:b.y,s:b.s,r:b.r,o:b.o,filter:c.filter,flip:c.flip,mask:c.mask?{...c.mask}:null,deco:c.deco?{...c.deco}:null});
  S.clips.push(f);S.sel=f.id;seek(f.start+.01);pushHist();everything();renderLib();
  toast(`已定格 ${dur} 秒，后面的内容自动后移`);
}

/* 画面里调整蒙版 */
function maskGeom(c){
  const bx=boxOf(c,S.t),sz=cSize(c),m=c.mask;
  return{bx,sz,m,s:bx.w/Math.max(1,sz.w)};
}
function toMaskLocal(c,p){
  const {bx,sz,m,s}=maskGeom(c),l=toLocal(bx,p.x,p.y),fl=c.flip?-1:1;
  const cx=l.x/s*fl,cy=l.y/s;
  const a=-(m.r||0)*Math.PI/180,dx=cx-m.x/100*sz.w,dy=cy-m.y/100*sz.h;
  return{x:dx*Math.cos(a)-dy*Math.sin(a),y:dx*Math.sin(a)+dy*Math.cos(a),cx,cy,s,fl,sz};
}
function maskHit(c,p){
  const m=c.mask;if(!m||m.kind==='none')return null;
  const L=toMaskLocal(c,p),w=m.w/100*L.sz.w,h=(m.kind==='linear'?100:m.h)/100*L.sz.h,k=pxScale()/L.s;
  if(m.kind!=='linear'&&Math.hypot(L.x-w/2,L.y-h/2)<14*k)return'size';
  if(m.kind==='linear')return Math.abs(L.x)<40*k?'move':null;
  if(Math.abs(L.x)<=w/2&&Math.abs(L.y)<=h/2)return'move';
  return null;
}
function drawMaskOverlay(c,k){
  const m=c.mask;if(!S.maskEdit||!m||m.kind==='none')return;
  const {bx,sz,s}=maskGeom(c),{W,H}=dims();
  octx.save();octx.translate(OPAD*W+bx.cx,OPAD*H+bx.cy);octx.rotate(bx.rot*Math.PI/180);octx.scale(s*(c.flip?-1:1),s);
  octx.translate(m.x/100*sz.w,m.y/100*sz.h);octx.rotate((m.r||0)*Math.PI/180);
  const w=m.w/100*sz.w,h=m.h/100*sz.h,u=k/s;
  octx.lineWidth=2*u;octx.strokeStyle='#ffd447';octx.setLineDash([8*u,5*u]);
  if(m.kind==='linear'){octx.beginPath();octx.moveTo(0,-sz.h);octx.lineTo(0,sz.h);octx.stroke()}
  else{octx.strokeRect(-w/2,-h/2,w,h)}
  octx.setLineDash([]);
  octx.beginPath();octx.arc(0,0,4*u,0,7);octx.fillStyle='#ffd447';octx.fill();
  if(m.kind!=='linear'){octx.fillRect(w/2-6*u,h/2-6*u,12*u,12*u);octx.strokeStyle='#000';octx.lineWidth=1*u;octx.strokeRect(w/2-6*u,h/2-6*u,12*u,12*u)}
  octx.restore();
}

/* ───────── 草稿（存在浏览器 IndexedDB 里，含素材） ───────── */
const DRAFT={id:null,name:'',ready:false,touched:false,timer:0,saving:false,again:false,ok:true,have:new Set()};
let _db=null;
function dbOpen(){
  if(_db)return Promise.resolve(_db);
  return new Promise((res,rej)=>{
    try{
      if(!window.indexedDB)return rej(new Error('no idb'));
      const rq=indexedDB.open('xiaojian-draft',1);
      rq.onupgradeneeded=()=>{const d=rq.result;d.createObjectStore('drafts',{keyPath:'id'});d.createObjectStore('blobs',{keyPath:'id'})};
      rq.onsuccess=()=>{_db=rq.result;res(_db)};rq.onerror=()=>rej(rq.error);rq.onblocked=()=>rej(new Error('blocked'));
    }catch(e){rej(e)}
  });
}
const dbReq=(store,mode,fn)=>dbOpen().then(d=>new Promise((res,rej)=>{
  const tx=d.transaction(store,mode),st=tx.objectStore(store),rq=fn(st);
  tx.oncomplete=()=>res(rq&&rq.result);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('abort'));
}));
const dbGet=(s,k)=>dbReq(s,'readonly',st=>st.get(k));
const dbPut=(s,v)=>dbReq(s,'readwrite',st=>st.put(v));
const dbDel=(s,k)=>dbReq(s,'readwrite',st=>st.delete(k));
const dbAll=s=>dbReq(s,'readonly',st=>st.getAll());
const dbKeys=s=>dbReq(s,'readonly',st=>st.getAllKeys());
const newDid=()=>'d'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const two=n=>String(n).padStart(2,'0');
const hhmm=ts=>{const d=new Date(ts);return two(d.getHours())+':'+two(d.getMinutes())};
const fmtDate=ts=>{const d=new Date(ts);return `${d.getMonth()+1}月${d.getDate()}日 ${hhmm(ts)}`};
const defaultName=()=>'未命名工程 '+fmtDate(Date.now());
function setSaveState(s){const e=$('#saveState');if(e)e.textContent=s}
function draftThumb(){
  try{const w=240,h=Math.round(w*cv.height/cv.width),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(cv,0,0,w,h);return c.toDataURL('image/jpeg',.7)}catch(e){return''}
}
async function buildRecord(){
  const refd=new Set();S.clips.forEach(c=>{if(c.asset)refd.add(c.asset)});
  const urlFirst=new Map(),metas=[],todo=[];
  for(const a of S.assets){
    if(a.builtin&&!refd.has(a.id))continue;
    const m={...a};delete m.url;delete m.missing;
    if(a.kind==='image'&&a.thumb===a.url)m.thumb='@url';
    const first=urlFirst.get(a.url);
    if(first)m.sameAs=first;else{urlFirst.set(a.url,a.id);todo.push(a)}
    metas.push(m);
  }
  for(const a of todo){
    if(DRAFT.have.has(a.id)||!a.url)continue;
    const bl=await(await fetch(a.url)).blob();
    await dbPut('blobs',{id:a.id,blob:bl});DRAFT.have.add(a.id);
  }
  return{id:DRAFT.id,name:DRAFT.name,updated:Date.now(),proj:S.proj,clips:S.clips,assets:metas,pps:S.pps,dur:totalDur(),thumb:draftThumb()};
}
async function saveDraft(manual){
  if(!DRAFT.ok)return false;
  if(DRAFT.saving){DRAFT.again=true;return false}
  DRAFT.saving=true;clearTimeout(DRAFT.timer);setSaveState('保存中…');
  try{
    if(!DRAFT.id){DRAFT.id=newDid();if(!DRAFT.name)DRAFT.name=defaultName()}
    const rec=await buildRecord();await dbPut('drafts',rec);
    setSaveState('已保存 '+hhmm(rec.updated));
    if(manual)toast('草稿已保存');
    return true;
  }catch(e){
    console.error(e);setSaveState('保存失败');
    toast('草稿没保存成功：'+(e&&e.name==='QuotaExceededError'?'浏览器存储空间不足，可以删掉旧草稿':'当前环境不允许保存'));
    return false;
  }finally{DRAFT.saving=false;if(DRAFT.again){DRAFT.again=false;scheduleSave(400)}}
}
function scheduleSave(ms){
  if(!DRAFT.ok||!DRAFT.ready)return;
  DRAFT.touched=true;clearTimeout(DRAFT.timer);setSaveState('有未保存的修改…');
  DRAFT.timer=setTimeout(()=>saveDraft(false),ms||2500);
}
histHook=()=>scheduleSave();

async function loadDraft(id){
  const rec=await dbGet('drafts',id);
  if(!rec){toast('找不到这个草稿');return false}
  DRAFT.ready=false;pause();
  const assets=[],loads=[];let lost=0;
  for(const m of rec.assets){
    if(m.sameAs)continue;
    const a={...m},row=await dbGet('blobs',m.id);
    if(!row){a.missing=true;lost++}else{a.url=URL.createObjectURL(row.blob);DRAFT.have.add(m.id)}
    if(m.thumb==='@url')a.thumb=a.url;
    if(a.kind==='image'&&a.url){loads.push(new Promise(res=>{const im=new Image();im.onload=()=>{IMG.set(a.id,im);if(a.mime&&/gif|webp/.test(a.mime))decodeGif(a);res()};im.onerror=()=>res();im.src=a.url}))}
    assets.push(a);
  }
  for(const m of rec.assets)if(m.sameAs){const base=assets.find(x=>x.id===m.sameAs);assets.push({...m,url:base?base.url:'',missing:!base||base.missing})}
  await Promise.all(loads);
  for(const id of [...RT.keys()])dropRT(id);
  const names=new Set(assets.filter(a=>a.builtin).map(a=>a.name));
  const keep=S.assets.filter(a=>a.builtin&&!names.has(a.name));
  S.assets=[...assets,...keep];
  S.proj=rec.proj;S.sel=null;S.t=0;S.pps=rec.pps||90;
  if(!S.proj.rowv){S.proj.rowv=2;rec.clips.forEach(c=>{c.row=3-c.row})}
  if(!S.proj.tracks)S.proj.tracks={};
  S.clips=rec.clips.filter(c=>!c.asset||S.assets.some(a=>a.id===c.asset&&!a.missing));
  $('#zoom').value=S.pps;
  DRAFT.id=rec.id;DRAFT.name=rec.name;DRAFT.touched=false;
  HI.stack=[snap()];HI.idx=0;histBtns();
  applyAspect();$('#aspect').value=S.proj.aspect;$('#bgcolor').value=S.proj.bg;
  S.clips.forEach(c=>{if(c.type==='text')loadFont(c)});
  $('#stageTip').textContent='';
  everything();renderLib();dirty=true;syncMedia(0,false);
  DRAFT.ready=true;setSaveState('已保存 '+hhmm(rec.updated));
  if(lost)toast(`有 ${lost} 个素材在浏览器里找不到了，相关片段已去掉`);
  return true;
}
async function newProject(){
  if(DRAFT.id||DRAFT.touched)await saveDraft(false);
  DRAFT.ready=false;pause();
  for(const id of [...RT.keys()])dropRT(id);
  S.clips=[];S.proj.tracks={};S.proj.marks=[];if(typeof BEATC!=='undefined')BEATC.key=null;S.selTrack=null;S.sel=null;S.t=0;DRAFT.id=null;DRAFT.name='';DRAFT.touched=false;
  $('#stageTip').textContent='';

}
async function draftBoot(){
  try{

/* 工程文件：XJP1 + 头长度 + JSON 头 + 各素材原始数据 */
async function packRecord(rec){
  const parts=[],assets=[];
  for(const m of rec.assets){
    if(m.sameAs){assets.push({meta:m,size:-1});continue}
    const row=await dbGet('blobs',m.id),bl=row?row.blob:new Blob([]);
    assets.push({meta:m,size:bl.size,type:bl.type});parts.push(bl);
  }
  const head=new TextEncoder().encode(JSON.stringify({v:1,name:rec.name,proj:rec.proj,clips:rec.clips,assets,pps:rec.pps,dur:rec.dur,thumb:rec.thumb}));
  const len=new Uint8Array(4);new DataView(len.buffer).setUint32(0,head.length);
  return new Blob([new TextEncoder().encode('XJP1'),len,head,...parts],{type:'application/octet-stream'});
}
async function unpackFile(file){
  const hd=new Uint8Array(await file.slice(0,8).arrayBuffer());
  if(String.fromCharCode(...hd.slice(0,4))!=='XJP1')throw new Error('这不是小剪动画的工程文件');
  const hl=new DataView(hd.buffer).getUint32(4);
  const head=JSON.parse(new TextDecoder().decode(new Uint8Array(await file.slice(8,8+hl).arrayBuffer())));
  let off=8+hl;
  for(const e of head.assets){
    if(e.size<0)continue;
    await dbPut('blobs',{id:e.meta.id,blob:file.slice(off,off+e.size,e.type)});off+=e.size;DRAFT.have.add(e.meta.id);
  }
  const rec={id:newDid(),name:(head.name||'工程')+' (导入)',updated:Date.now(),proj:head.proj,clips:head.clips,assets:head.assets.map(e=>e.meta),pps:head.pps,dur:head.dur,thumb:head.thumb};
  await dbPut('drafts',rec);return rec;
}
async function gcBlobs(){
  const all=await dbAll('drafts'),keep=new Set();
  all.forEach(r=>r.assets.forEach(m=>{if(!m.sameAs)keep.add(m.id)}));
  for(const k of await dbKeys('blobs'))if(!keep.has(k)){await dbDel('blobs',k);DRAFT.have.delete(k)}
}

/* ───────── 轨道：标签 / 小窗轨 / 整理 / 合并 / 布局模板 ───────── */
function setTrack(r,o){if(!S.proj.tracks)S.proj.tracks={};const t=S.proj.tracks[r]||(S.proj.tracks[r]={});Object.assign(t,o);return t}
function trackName(r){const o=rowOpt(r);if(o.name)return o.name;return r===0?'主画面':r>0?'叠加 '+r:'音频 '+(-r)}
function trackBusy(r){const o=rowOpt(r);return S.clips.some(c=>c.row===r)||!!(o.name||o.hide||o.mute||(o.win&&o.win.on))}
function deleteTrack(r,quiet){
  if(r===0){toast('主画面轨不能删，要清空请选中片段按 Delete');return 0}
  const n=S.clips.filter(c=>c.row===r).length;
  S.clips.filter(x=>x.row===r).forEach(x=>dropRT(x.id));S.clips=S.clips.filter(x=>x.row!==r);
  if(S.proj.tracks)delete S.proj.tracks[r];
  if(S.selTrack===r)S.selTrack=null;
  if(S.sel&&!S.clips.some(c=>c.id===S.sel))S.sel=null;
  if(!quiet){pushHist();everything();toast(n?`已删除这条轨道和里面的 ${n} 个片段（Ctrl+Z 可撤销）`:'已删除这条空轨道')}
  return n;
}
function layoutTracks(){const T=S.proj.tracks||{};return Object.keys(T).map(Number).filter(r=>r>0&&T[r]&&T[r].win&&T[r].win.on&&/^(分屏|小窗) \d+$/.test(T[r].name||''))}
function renderTrackLabels(RL){
  const el=$('#tlLabInner');if(!el)return;
  el.innerHTML=RL.map((r,i)=>{
    const o=rowOpt(r),spare=!trackBusy(r)&&(i===0||i===RL.length-1);
    const delb=`<button data-tb="del" title="删除这条轨道（连同里面的片段，可撤销）">✕</button>`;
    const fd=o.fold,H=rowH(r),fb=`<button data-tb="fold" title="${fd?'展开':'折叠'}这条轨道">${fd?'▸':'▾'}</button>`;
    if(fd)return `<div class="tlab fold${r<0?' aud':''}${S.selTrack===r?' on':''}" style="height:${H}px;padding:0 4px" data-trow="${r}"><span class="nm">${esc(trackName(r))} · ${S.clips.filter(c=>c.row===r).length}</span><span class="ic">${r!==0?delb:''}${fb}</span></div>`;
    if(spare)return `<div class="tlab spare" data-trow="${r}" title="把片段拖到这一行，会自动新建一条轨道"><span class="nm">＋ 新轨道</span></div>`;
    const btn=r<0?`<button data-tb="mute" class="${o.mute?'x':''}" title="静音这条轨道">${o.mute?'🔇':'🔊'}</button>`:`<button data-tb="hide" class="${o.hide?'x':''}" title="显示 / 隐藏这条轨道">${o.hide?'🚫':'👁'}</button>`;
    return `<div class="tlab${r<0?' aud':''}${S.selTrack===r?' on':''}${o.hide?' off':''}" data-trow="${r}" title="点击选中这条轨道：改名、设为小窗轨、合并"><span class="nm">${esc(trackName(r))}</span><span class="ic">${winOf(r)?'<i class="wn">窗</i>':''}${btn}${r!==0?delb:''}${fb}</span></div>`;
  }).join('');
  const sc=$('#tlScroll');el.style.transform=`translateY(${-(sc?sc.scrollTop:0)}px)`;
}

$('#tlLabels').addEventListener('click',e=>{
  const row=e.target.closest('[data-trow]');if(!row)return;

const WIN_POS={tl:[.25,.25,.46,.46],tr:[.75,.25,.46,.46],bl:[.25,.75,.46,.46],br:[.78,.76,.4,.4],c:[.5,.5,.6,.6],L:[.25,.5,.5,1],R:[.75,.5,.5,1],T:[.5,.25,1,.5],B:[.5,.75,1,.5],full:[.5,.5,1,1]};
function winRng(label,key,min,max,step,val,u,mul){

}
function trackInspector(el){

  let h=`<div class="sec"><span><span class="badge" style="background:var(--c-shape)">轨道</span>${esc(trackName(r))}</span><small>${n} 个片段</small></div>`;
  h+=`<label class="fld"><span>名称</span><input type="text" id="trName" value="${esc(o.name||'')}" placeholder="${esc(trackName(r))}" maxlength="10"></label>`;
  h+=`<div class="row2"><label class="lbl-inline"><input type="checkbox" data-tk="fold" ${o.fold?'checked':''}> 折叠成细条</label></div><div class="row2"><label class="lbl-inline" title="拖动或拉长一个文字片段时，同一轨道上相邻的文字自动被压短，不用手动一个个让位"><input type="checkbox" data-tk="squeeze" ${squeezeOn(r)?'checked':''}> 挤压相邻字幕/文字</label></div><div class="row2">${r<0?`<label class="lbl-inline"><input type="checkbox" data-tk="mute" ${o.mute?'checked':''}> 静音</label>`:`<label class="lbl-inline"><input type="checkbox" data-tk="hide" ${o.hide?'checked':''}> 隐藏画面和声音</label>`}</div>`;
  if(r>0){
    h+=`<div class="sec">小窗轨<small>整条轨道缩成一个小窗口</small></div>
    <div class="row2"><label class="lbl-inline"><input type="checkbox" data-tk="win" ${w?'checked':''}> 把这条轨道变成小窗口</label></div>`;
    if(!w)h+=`<div class="tip">打开后，这条轨道上<b>所有</b>片段（视频、文字、贴纸、动图…）会一起缩进一个窗口，一起移动、缩放、加圆角边框。窗口里的内容仍然按时间轴播放，每个片段还能单独做动画。</div>`;
    else{
      const d=w.deco||(w.deco={rad:0,bw:0,bc:'#ffffff',sh:false,bs:'solid'});
      h+=`<div class="chips">${[['tl','左上'],['tr','右上'],['bl','左下'],['br','右下'],['c','居中'],['L','左半屏'],['R','右半屏'],['T','上半屏'],['B','下半屏'],['full','全屏']].map(([k,t])=>`<button class="chip" data-wpos="${k}">${t}</button>`).join('')}</div>`;
      h+=winRng('中心 X','x',-50,150,1,Math.round(w.x*100),'%',.01)+winRng('中心 Y','y',-50,150,1,Math.round(w.y*100),'%',.01)+winRng('宽','w',5,200,1,Math.round(w.w*100),'%',.01)+winRng('高','h',5,200,1,Math.round(w.h*100),'%',.01)+winRng('旋转','r',-180,180,1,w.r||0,'°')+winRng('不透明','o',0,100,1,Math.round((w.o==null?1:w.o)*100),'%',.01);
      h+=winRng('圆角','deco.rad',0,300,1,d.rad||0,'px')+winRng('边框粗细','deco.bw',0,40,1,d.bw||0,'px');
      h+=`<div class="row2"><span>边框色</span><input type="color" data-wp="deco.bc" data-t="s" value="${d.bc||'#ffffff'}"><span>窗底色</span><input type="color" data-wp="bg" data-t="s" value="${w.bg||'#000000'}"><label class="lbl-inline"><input type="checkbox" data-wp="deco.sh" data-t="b" ${d.sh?'checked':''}> 阴影</label></div>`;
      h+=`<div class="chips">${[['solid','实线'],['dash','虚线'],['double','双线'],['neon','霓虹']].map(([k,t])=>`<button class="chip${(d.bs||'solid')===k?' on':''}" data-wbs="${k}">${t}</button>`).join('')}</div>`;
      h+=`<div class="tip">在画面上直接拖窗口移动，拖角缩放，拖上方圆点旋转。要改窗口里的某个片段，到时间轴上点它。</div>`;
    }
  }
  h+=`<div class="sec">整理</div><div class="row2"><button class="btn sm" data-tk="close">去除空隙</button><button class="btn sm" data-tk="tidy">整理全部轨道</button></div>`;
  const targets=tlRowList().filter(q=>q!==r&&(r<0?q<0:q>=0)&&trackBusy(q));
  if(n&&targets.length)h+=`<div class="row2"><select id="mergeTo" aria-label="并入轨道">${targets.map(q=>`<option value="${q}">${esc(trackName(q))}</option>`).join('')}</select><button class="btn sm" data-tk="mergeto">并入这条轨道</button></div><div class="tip">把本轨的片段搬到目标轨道；时间上冲突的会留在原轨道。</div>`;
  if(n)h+=`<div class="row2"><button class="btn sm danger" data-tk="clear">删除本轨全部片段</button></div>`;
  if(r!==0)h+=`<div class="row2"><button class="btn sm danger" data-tk="deltrack">🗑 删除这条轨道${n?'（含 '+n+' 个片段）':''}</button></div>`;
  el.innerHTML=h;
}
function setWinPath(w,p,v){
  const ks=p.split('.');let o=w;for(let i=0;i<ks.length-1;i++){o=o[ks[i]]||(o[ks[i]]={})}o[ks[ks.length-1]]=v;
}
$('#inspBody').addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='trName'&&S.selTrack!=null){setTrack(S.selTrack,{name:t.value.trim()||undefined});renderTrackLabels(tlRowList());return}
  const p=t.dataset.wp;if(!p||S.selTrack==null)return;
  const w=winOf(S.selTrack);if(!w)return;
  let v=t.dataset.t==='s'?t.value:t.dataset.t==='b'?t.checked:+t.value*(+t.dataset.mul||1);
  setWinPath(w,p,v);
  if(t.type==='range'&&t.nextElementSibling)t.nextElementSibling.textContent=unit[t.dataset.u||'n'](+t.value);
  dirty=true;
});
$('#inspBody').addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='trName'&&S.selTrack!=null){pushHist();return}
  if(t.dataset.wp&&S.selTrack!=null){pushHist();return}
  if(t.dataset.tk==='swapsel'){swapAsset(t.value);return}
});
function winOn(r,on){
  if(on){
    const w=JSON.parse(JSON.stringify(WIN_DEF));setTrack(r,{win:w});
  }else if(rowOpt(r).win)rowOpt(r).win.on=false;
}
$('#inspBody').addEventListener('click',e=>{
  const wp=e.target.closest('[data-wpos]'),bs=e.target.closest('[data-wbs]');
  if(S.selTrack!=null){
    const w=winOf(S.selTrack);
    if(wp&&w){const P=WIN_POS[wp.dataset.wpos];Object.assign(w,{x:P[0],y:P[1],w:P[2],h:P[3]});pushHist();renderInspector();dirty=true;return}
    if(bs&&w){(w.deco||(w.deco={})).bs=bs.dataset.wbs;if(!w.deco.bw)w.deco.bw=6;pushHist();renderInspector();dirty=true;return}
  }
  const b=e.target.closest('[data-tk]');if(!b||b.tagName==='SELECT')return;
  const k=b.dataset.tk,c=sel();
  let r=S.selTrack;
  if(k==='makewin'){
    if(!c)return;
    if(c.row===0){let q=1;while(!rowFree(q,c.start,c.dur,c.id)||trackBusy(q))q++;c.row=q}
    r=c.row;winOn(r,true);S.sel=null;S.selTrack=r;pushHist();everything();toast('这条轨道已变成小窗轨：可以拖动 / 缩放整个窗口');return;
  }
  if(k==='tidy'){tidyTracks();return}
  if(r==null)return;
  if(k==='squeeze'){setTrack(r,{squeeze:b.checked});pushHist();return}
  if(k==='hide'||k==='mute'||k==='fold'){setTrack(r,{[k]:b.checked});pushHist();renderTimeline();dirty=true;return}
  if(k==='win'){winOn(r,b.checked);pushHist();renderTimeline();renderInspector();dirty=true;return}
  if(k==='close'){closeGaps(r);return}
  if(k==='mergeto'){mergeTrack(r,+$('#mergeTo').value);return}
  if(k==='deltrack'){deleteTrack(r);return}
  if(k==='clear'){
    S.clips.filter(x=>x.row===r).forEach(x=>dropRT(x.id));S.clips=S.clips.filter(x=>x.row!==r);
    pushHist();everything();toast('已清空这条轨道');return;
  }
});
/* 去除空隙：本轨片段首尾相接 */
function closeGaps(r){
  const l=S.clips.filter(c=>c.row===r).sort((a,b)=>a.start-b.start);let t=0,n=0;
  for(const c of l){if(c.start>t+.01){c.start=t;n++}t=c.start+c.dur}
  if(!n){toast('这条轨道没有空隙');return}
  pushHist();everything();toast(`已去除空隙，移动了 ${n} 个片段`);
}
function mergeTrack(from,to){
  const l=S.clips.filter(c=>c.row===from);let moved=0;
  for(const c of l)if(rowFree(to,c.start,c.dur,c.id)){c.row=to;moved++}
  const left=l.length-moved;
  if(!left){if(S.proj.tracks)delete S.proj.tracks[from];S.selTrack=to}
  pushHist();everything();
  toast(left?`已并入 ${moved} 个片段，${left} 个因时间重叠留在原轨道`:`已全部并入“${trackName(to)}”`);
}
/* 整理轨道：能放进下层空位的片段下移，空轨道删掉，轨道编号重排 */
function tidyTracks(){
  const plain=r=>{const o=rowOpt(r);return !(o.name||o.hide||o.mute||o.fold||(o.win&&o.win.on))};
  const before=new Set(S.clips.map(c=>c.row)).size;let moved=0;
  const srt=(a,b)=>a.start-b.start;
  const posRows=[...new Set(S.clips.filter(c=>c.row>0).map(c=>c.row))].sort((a,b)=>a-b);
  for(const r of posRows){if(!plain(r))continue;
    for(const c of S.clips.filter(x=>x.row===r).sort(srt))for(let q=1;q<r;q++)if(plain(q)&&rowFree(q,c.start,c.dur,c.id)){c.row=q;moved++;break}}
  const negRows=[...new Set(S.clips.filter(c=>c.row<0).map(c=>c.row))].sort((a,b)=>b-a);
  for(const r of negRows){if(!plain(r))continue;
    for(const c of S.clips.filter(x=>x.row===r).sort(srt))for(let q=-1;q>r;q--)if(plain(q)&&rowFree(q,c.start,c.dur,c.id)){c.row=q;moved++;break}}
  const T=S.proj.tracks||{},used=new Set(S.clips.map(c=>c.row));
  Object.keys(T).forEach(k=>{const o=T[k];if(o&&(o.name||o.hide||o.mute||o.fold||(o.win&&o.win.on)))used.add(+k)});
  const pos=[...used].filter(r=>r>0).sort((a,b)=>a-b),neg=[...used].filter(r=>r<0).sort((a,b)=>b-a),map={0:0};
  pos.forEach((r,i)=>map[r]=i+1);neg.forEach((r,i)=>map[r]=-(i+1));
  let renum=false;for(const k in map)if(map[k]!==+k)renum=true;
  S.clips.forEach(c=>{c.row=map[c.row]!=null?map[c.row]:c.row});
  const NT={};for(const k of Object.keys(T)){if(map[k]!=null)NT[map[k]]=T[k]}
  S.proj.tracks=NT;if(S.selTrack!=null)S.selTrack=map[S.selTrack]!=null?map[S.selTrack]:null;
  const after=new Set(S.clips.map(c=>c.row)).size;
  if(!moved&&!renum){toast('轨道已经很整齐了');return}
  pushHist();everything();toast(`整理完成：${moved?moved+' 个片段并入下层空位，':''}轨道 ${before} → ${after} 条`);
}
$('#tidy').onclick=tidyTracks;

/* ----- 合并片段：把被分割开的同一素材接回一段 ----- */
function joinSel(){
  const c=sel();if(!c){toast('先点选要合并的片段，会和它右边紧挨着的那一段合并');return}
  const n=S.clips.filter(x=>x.row===c.row&&x.id!==c.id&&x.start>=c.start+c.dur-.06).sort((a,b)=>a.start-b.start)[0];
  if(!n||n.start-(c.start+c.dur)>.08){toast('右边没有紧挨着的片段。可先点“整理轨道 / 去除空隙”把它们靠拢');return}
  let ok=n.type===c.type&&n.asset===c.asset&&c.type!=='text'&&c.type!=='toon'&&c.type!=='sticker'&&c.type!=='shape';
  if(ok&&(c.type==='video'||c.type==='audio'))ok=Math.abs((c.speed||1)-(n.speed||1))<.01&&Math.abs(c.srcIn+c.dur*(c.speed||1)-n.srcIn)<.15;
  if(!ok){
    if(c.type===n.type&&(c.type==='text'||c.type==='sticker'||c.type==='shape')&&JSON.stringify(Object.assign({},c,{id:0,start:0,dur:0,kf:0,anim:0,ain:0,aout:0,aloop:0}))===JSON.stringify(Object.assign({},n,{id:0,start:0,dur:0,kf:0,anim:0,ain:0,aout:0,aloop:0}))) ok=true;
  }
  if(!ok){toast('这两段不是同一素材连续的两半，没法无缝合并。想把几条轨道叠在一起用，可选中轨道后“并入”，或设成小窗轨');return}
  const off=c.dur;
  n.kf.forEach(k=>c.kf.push({...k,t:k.t+off}));
  c.dur=n.start+n.dur-c.start;c.anim.out=n.anim.out;c.aout=n.aout;
  S.clips=S.clips.filter(x=>x.id!==n.id);dropRT(n.id);
  pushHist();everything();toast('已合并成一段');
}
$('#join').onclick=joinSel;

/* ----- 换素材（保留位置、动画、小窗设置） ----- */
function swapAsset(id){
  const c=sel(),a=asset(id);if(!c||!a||!(c.type==='image'||c.type==='video'))return;
  dropRT(c.id);c.asset=id;c.type=a.kind;
  if(a.kind==='video'){c.srcIn=0;c.dur=Math.min(c.dur,a.dur/(c.speed||1))||c.dur}else c.srcIn=0;
  pushHist();everything();toast('已换成“'+a.name+'”');
}

function applyLayout(L){
  const media=S.assets.filter(a=>a.kind==='video'||a.kind==='image');
  if(!media.length){toast('先在“素材”里导入图片或视频');return}
  const real=media.filter(a=>!a.builtin&&!a.bg),pool=real.length?real:media;
  let base=Math.max(0,...S.clips.map(c=>c.row))+1;
  const gap=S.layGap?.016:0,dur=Math.min(8,Math.max(3,...L.c.map((_,i)=>{const a=pool[i%pool.length];return a.kind==='video'?a.dur:4})));
  let ids=[];
  L.c.forEach(([x,y,w,h],i)=>{
    const a=pool[i%pool.length],row=base+i;
    const c=newClip(a.kind,{asset:a.id,dur:a.kind==='video'?Math.min(a.dur,dur):dur,fit:'cover'});
    c.start=S.t;c.row=row;if(i>0)c.vol=0;S.clips.push(c);ids.push(c.id);
    const g=L.pip?0:gap,d=S.layGap||L.pip?{rad:L.pip?28:20,bw:L.pip?6:0,bc:'#ffffff',sh:!!L.pip,bs:'solid'}:{rad:0,bw:0,bc:'#ffffff',sh:false,bs:'solid'};
    setTrack(row,{name:(L.pip?'小窗 ':'分屏 ')+(i+1),win:{on:true,x,y,w:Math.max(.05,w-g*2),h:Math.max(.05,h-g*2),r:0,o:1,bg:'#000000',deco:d}});
  });
  S.sel=null;S.selTrack=base;seek(S.t+.01);pushHist();everything();
  if(S.lib==='layout')renderLib();
  toast(`已套用“${L.n}”：${L.c.length} 条小窗轨`);
}

  if(!a.flux){toast('这段音频没能分析出节拍');return}
  if(!(a.beats&&a.beats.length>3)){a.mode='onset';a.sens=Math.max(a.sens||0,.6);recomputeBeats(a)}

function hpHide(){

function hpPlace(target){
  const r=target.getBoundingClientRect(),d=HP.el,w=d.offsetWidth,h=d.offsetHeight,vw=innerWidth,vh=innerHeight;
  let x=r.right+12,y=r.top+r.height/2-h/2;

  d.style.left=Math.round(x)+'px';d.style.top=Math.round(clamp(y,8,Math.max(8,vh-h-8)))+'px';

function hpToon(id,body){
  const t=TOONS[id];if(!t)return false;
  const cvs=document.createElement('canvas');cvs.width=320;cvs.height=240;body.appendChild(cvs);
  const g=cvs.getContext('2d'),F=2.4;
  const loop=now=>{
    const T=now/1000;
    g.clearRect(0,0,320,240);
    g.fillStyle='#2b2942';g.fillRect(0,0,320,240);
    g.fillStyle='rgba(255,255,255,.04)';for(let i=0;i<320;i+=20)for(let j=0;j<240;j+=20)if(((i+j)/20)%2===0)g.fillRect(i,j,20,20);
    g.save();g.translate(160,120);
    const P={W:1280,H:720,k:1,color:t.color,label:t.label||'',x:0,y:0,vx:0,dur:4};
    const sc=(t.full?.1:Math.min(120/t.w,90/t.h))*F;
    g.scale(sc,sc);g.lineJoin='round';g.lineCap='round';
    try{
      if(t.prev)t.prev(P,T);
      const tt=(t.id==='arrow'||t.id==='boom'||t.id==='speech')?T%3:T,u=t.id==='hand'?(T%3)/3:(T%4)/4;
      t.draw(g,tt,u,P);
    }catch(e){}
    g.restore();
    HP.raf=requestAnimationFrame(loop);
  };
  HP.raf=requestAnimationFrame(loop);return true;
}
