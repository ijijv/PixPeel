  return `<div class="sub" style="margin-top:14px">我的片段 · ${sn.length}<small style="margin-left:6px;color:var(--mut)">点一下插入</small></div><div class="assets">${sn.map(s=>`<div class="asset" data-snip="${s.id}" tabindex="0" title="点击插入到播放头位置"><img src="${s.thumb}" alt=""><button class="xdel" data-delsnip="${s.id}" title="删除这个片段">×</button><span class="nm">${esc(s.name)} · ${s.dur.toFixed(1)}s</span></div>`).join('')}</div>`;
}
function stkHTML(){
  const l=S.assets.filter(a=>a.stk);
  return `<label class="drop" id="dropStk" tabindex="0" style="margin-bottom:8px">＋ 导入贴图 / GIF<br><span style="font-size:12px">PNG（透明背景最佳）· GIF 动图 · WebP</span><input type="file" id="stkIn" accept="image/*" multiple hidden></label>
  ${l.length?`<div class="sub">我的贴图 · ${l.length}</div><div class="assets stk">${l.map(a=>`<div class="asset" data-stk="${a.id}" tabindex="0" title="点击加到画面"><img src="${a.thumb||a.url}" alt=""><button class="xdel" data-delasset="${a.id}" title="删除这个贴图">×</button><span class="nm">${esc(a.name)}${a.animated?' · 动图':''}</span></div>`).join('')}</div>`:'<div class="tip" style="margin-bottom:8px">还没有贴图。可以导入自己的 PNG / GIF，或者在画面里“框选截取”存成贴图。</div>'}
  ${xlHTML()}
  <label class="drop" id="dropSeg" tabindex="0" style="margin-bottom:8px">✂ 从图片里拆元素<br><span style="font-size:12px">选一张图，自动把里面每个东西拆成透明贴纸</span><input type="file" id="segIn" accept="image/*" hidden></label>
  <div class="sub">表情贴纸</div>`;
}
function cleanBtn(){
  const n=S.assets.filter(assetUnused).length;
  return n?`<div class="row2" style="margin:8px 0 0"><button class="btn sm" id="cleanAssets">🧹 清理 ${n} 个没用到的素材</button></div>`:'';
}
async function importStickers(files){
  let n=0;
  for(const f of files){
    if(!f.type.startsWith('image/')){toast('贴图只支持图片和 GIF');continue}
    const a=await addImageAsset(f);if(a){a.stk=true;n++}
  }
  renderLib();if(histHook)histHook();if(n)toast(`已导入 ${n} 个贴图，点一下加到画面`);
}
function addStickerImg(a){
  const c=newClip('image',{asset:a.id,dur:a.animated&&a.gdur?Math.max(2,Math.min(10,Math.ceil(a.gdur))):3,fit:'contain'});
  c.start=S.t;c.s=.4;
  addClip(c,[3,2,1]);
}
function addSnip(sn){
  const a=asset(sn.asset);if(!a){toast('这个片段的原视频已经被删除了');return}
  const c=newClip('video',{asset:a.id,dur:sn.dur,srcIn:sn.srcIn,fit:'cover'});
  insertMain(c,S.t);S.clips.push(c);S.sel=c.id;S.multi=[];seek(c.start+.01);LASTADD={id:c.id,t:S.t};pushHist();everything();toast('已插入片段');
}
$('#libBody').addEventListener('click',e=>{
  const da=e.target.closest('[data-delasset]'),ds=e.target.closest('[data-delsnip]'),cl=e.target.closest('#cleanAssets');
  if(da||ds){
    e.stopPropagation();e.preventDefault();
    const b=da||ds,key=(da?'a':'s')+(da?da.dataset.delasset:ds.dataset.delsnip);
    if(ARM&&ARM.key===key){
      clearTimeout(ARM.t);ARM=null;
      if(da){const n=deleteAssets([da.dataset.delasset]);toast(n?`已删除素材，并移除了用到它的 ${n} 个片段`:'已删除素材')}
      else{S.proj.snips=(S.proj.snips||[]).filter(s=>s.id!==ds.dataset.delsnip);pushHist();renderLib();toast('已删除片段')}
      return;
    }
    if(ARM){clearTimeout(ARM.t);ARM.b.classList.remove('arm');ARM.b.textContent='×'}
    const us=da?assetUsers(da.dataset.delasset).length:0;
    b.classList.add('arm');b.textContent=us?`确认删除？（会同时删 ${us} 个片段）`:'确认删除？';
    ARM={key,b,t:setTimeout(()=>{b.classList.remove('arm');b.textContent='×';ARM=null},3000)};
    return;
  }
  if(cl){
    e.stopPropagation();
    const ids=S.assets.filter(assetUnused).map(a=>a.id);
    if(!ids.length)return;
    deleteAssets(ids);toast(`已清理 ${ids.length} 个没用到的素材`);return;
  }
  const sn=e.target.closest('[data-snip]');if(sn){const s=(S.proj.snips||[]).find(x=>x.id===sn.dataset.snip);if(s)addSnip(s);return}
  const st=e.target.closest('[data-stk]');if(st){const a=asset(st.dataset.stk);if(a)addStickerImg(a);return}
},true);
$('#libBody').addEventListener('change',e=>{if(e.target.id==='segIn'){segOpenFile(e.target.files[0]);e.target.value=''}if(e.target.id==='stkIn'){importStickers([...e.target.files]);e.target.value=''}});

/* ───────── 截取：当前帧 / 框选区域 / 视频片段 → 素材 ───────── */
function addImageFromCanvas(cvs,name,stk){
  return new Promise(res=>cvs.toBlob(bl=>{
    if(!bl){toast('截取失败');res(null);return}
    const url=URL.createObjectURL(bl),im=new Image();
    im.onload=()=>{
      const th=document.createElement('canvas');th.width=160;th.height=Math.max(1,Math.round(160*cvs.height/cvs.width));th.getContext('2d').drawImage(cvs,0,0,th.width,th.height);
      const a={id:uid(),kind:'image',name,url,w:cvs.width,h:cvs.height,thumb:th.toDataURL('image/png'),mime:'image/png'};
      if(stk)a.stk=true;
      IMG.set(a.id,im);S.assets.push(a);renderLib();if(histHook)histHook();dirty=true;res(a);
    };
    im.src=url;
  },'image/png'));
}
let GRABN=1;
function grabFrame(c){
  const src=mediaSrc(c,clamp(S.t-c.start,0,c.dur));
  if(!src){toast('这一帧还没加载好，稍等一下再点');return}
  const s=Math.min(1,2048/Math.max(src.w,src.h)),cvs=document.createElement('canvas');
  cvs.width=Math.round(src.w*s);cvs.height=Math.round(src.h*s);
  const g=cvs.getContext('2d');
  const kd=c.key&&c.key.on?keyed(c,src):null;
  g.drawImage(kd||src.el,0,0,cvs.width,cvs.height);
  addImageFromCanvas(cvs,'截帧 '+(GRABN++)+' · '+fmtDur(clamp(S.t-c.start,0,c.dur)+(c.srcIn||0)),false).then(a=>{if(a)toast('已把这一帧存进“素材”，随时可以插入')});
}
function startCrop(){
  S.crop=!S.crop;S.cropRect=null;
  ov.style.cursor=S.crop?'crosshair':'';
  $('#stageTip').textContent=S.crop?'在画面上拖出一个框，松开就保存成贴图（Esc 取消）':'';
  dirty=true;renderCtx();
}
function finishCrop(){
  const q=S.cropRect;S.cropRect=null;S.crop=false;ov.style.cursor='';$('#stageTip').textContent='';dirty=true;renderCtx();
  if(!q||!cdrag.moved)return;
  const {W,H}=dims(),x=clamp(Math.min(q.x0,q.x1),0,W),y=clamp(Math.min(q.y0,q.y1),0,H),w=clamp(Math.abs(q.x1-q.x0),0,W-x),h=clamp(Math.abs(q.y1-q.y0),0,H-y);
  if(w<8||h<8){toast('框太小了，再拖大一点');return}
  const full=document.createElement('canvas');full.width=W;full.height=H;
  const g=full.getContext('2d'),main=ctx,c=sel();
  ctx=g;
  try{
    if(c&&c.type!=='audio'&&isActive(c,S.t)){drawClip(c,S.t)}
    else renderFrame(S.t);
  }finally{ctx=main}
  const out=document.createElement('canvas');out.width=Math.round(w);out.height=Math.round(h);
  out.getContext('2d').drawImage(full,x,y,w,h,0,0,out.width,out.height);
  addImageFromCanvas(out,(c&&c.type!=='audio'?'截取 ':'画面截取 ')+(GRABN++),true).then(a=>{if(a){S.lib='sticker';renderLib();toast('已存进“贴图”：'+(c&&c.type!=='audio'?'只截了选中的这个元素（背景透明）':'截的是整个画面')+'，点一下就能加到画面')}});
}
function saveSnip(c){
  if(c.type!=='video'){toast('只有视频片段能存成“我的片段”');return}
  const a=asset(c.asset);if(!a)return;
  const sn={id:uid(),name:'片段 '+((S.proj.snips||[]).length+1),asset:a.id,srcIn:+c.srcIn.toFixed(3),dur:+c.dur.toFixed(3)};
  const src=mediaSrc(c,0);
  try{const th=document.createElement('canvas');th.width=160;th.height=Math.round(160*a.h/a.w)||90;if(src)th.getContext('2d').drawImage(src.el,0,0,th.width,th.height);sn.thumb=th.toDataURL('image/jpeg',.7)}catch(e){sn.thumb=a.thumb||''}
  (S.proj.snips||(S.proj.snips=[])).push(sn);
  pushHist();if(S.lib==='media')renderLib();
  toast(`已把这一段（${sn.dur.toFixed(1)} 秒）存进“素材 → 我的片段”。想存别的部分，先分割 / 裁剪再点。`);
}
/* ───────── 自动字幕 + WebM 时长修复 ───────── */
/* WebM：MediaRecorder 录出来的文件没有时长信息，播放器会显示成很长或无限。导出后补写 Duration。 */
async function fixWebmDuration(blob,durSec){
  try{
    const u=new Uint8Array(await blob.arrayBuffer());
    if(u[0]!==0x1A||u[1]!==0x45||u[2]!==0xDF||u[3]!==0xA3)return blob;
    const vint=(p)=>{const b=u[p];let n=1,m=0x80;while(n<=8&&!(b&m)){n++;m>>=1}let v=b&(m-1),unk=(b&(m-1))===m-1;for(let i=1;i<n;i++){v=v*256+u[p+i];if(u[p+i]!==255)unk=false}return{n,v,unk}};
    const id=(p)=>{const b=u[p];const n=b&0x80?1:b&0x40?2:b&0x20?3:4;let v=0;for(let i=0;i<n;i++)v=v*256+u[p+i];return{n,v}};
    let p=0;const e0=id(0),s0=vint(e0.n);p=e0.n+s0.n+s0.v;           // 跳过 EBML 头
    const segId=id(p);if(segId.v!==0x18538067)return blob;
    const segSz=vint(p+segId.n),segSzPos=p+segId.n,segBody=segSzPos+segSz.n;
    let q=segBody,infoPos=-1,scale=1e6;
    while(q<Math.min(u.length,segBody+4096)){
      const i=id(q),s=vint(q+i.n);
      if(i.v===0x1549A966){infoPos=q;break}
      if(s.unk)break;q+=i.n+s.n+s.v;
    }
    if(infoPos<0)return blob;
    const infoId=id(infoPos),infoSz=vint(infoPos+infoId.n),infoBody=infoPos+infoId.n+infoSz.n;
    // 已有 Duration 就不动
    let r=infoBody;while(r<infoBody+infoSz.v){const i=id(r),s=vint(r+i.n);if(i.v===0x4489)return blob;if(i.v===0x2AD7B1){let v=0;for(let k=0;k<s.v;k++)v=v*256+u[r+i.n+s.n+k];scale=v}r+=i.n+s.n+s.v}
    const dur=new Uint8Array(11);dur[0]=0x44;dur[1]=0x89;dur[2]=0x88;
    new DataView(dur.buffer).setFloat64(3,durSec*1e9/scale);
    const setSize=(arr,pos,n,val)=>{for(let k=n-1;k>=0;k--){arr[pos+k]=val%256;val=Math.floor(val/256)}arr[pos]=(arr[pos]&((1<<(8-n))-1))|(1<<(8-n))};
    const out=new Uint8Array(u.length+11);
    out.set(u.subarray(0,infoBody+infoSz.v),0);out.set(dur,infoBody+infoSz.v);out.set(u.subarray(infoBody+infoSz.v),infoBody+infoSz.v+11);
    setSize(out,infoPos+infoId.n,infoSz.n,infoSz.v+11);
    if(!segSz.unk)setSize(out,segSzPos,segSz.n,segSz.v+11);
    return new Blob([out],{type:blob.type});
  }catch(e){console.warn('fixWebmDuration',e);return blob}
}

async function getPCM(c,sr){
  const a=asset(c.asset);ensureAC();

function splitScript(txt){

    const ln=raw.trim();if(!ln)continue;
    if(ln.length<=22&&!/[。！？!?…].+/.test(ln)){out.push(ln);continue}

async function seekVideosTo(t){
  const frozen=new Set();
  for(const c of S.clips)if(c.trans&&isMedia(c)&&t>=c.start&&t<c.start+c.trans.dur){const p=prevOf(c);if(p&&p.type==='video')frozen.add(p.id)}
  const waits=[];
  for(const c of S.clips){
    if(c.type!=='video')continue;
    let target;
    if(frozen.has(c.id))target=c.srcIn+Math.max(0,c.dur-.03)*c.speed;
    else if(t>=c.start&&t<c.start+c.dur)target=c.srcIn+(t-c.start)*c.speed;
    else continue;
    const v=vEl(c);if(!v.paused)v.pause();
    if(isFinite(v.duration))target=Math.min(target,Math.max(0,v.duration-.001));
    if(Math.abs(v.currentTime-target)>.0005)v.currentTime=target;
    waits.push(v);

  if(waits.length)await Promise.all(waits.map(waitReady));
}
async function mixAudio(total,sr){

async function pickCodecs(fmt,W,H,fps,bps,needA){
  const vOpt=async list=>{for(const codec of list){try{const r=await VideoEncoder.isConfigSupported({codec,width:W,height:H,bitrate:bps,framerate:fps});if(r.supported)return codec}catch(e){}}return null};
  const aOpt=async codec=>{try{return (await AudioEncoder.isConfigSupported({codec,sampleRate:48000,numberOfChannels:2,bitrate:128000})).supported}catch(e){return false}};
  if(fmt==='mp4'){
    const v=await vOpt(['avc1.640028','avc1.640032','avc1.4D4028','avc1.42E01F']);
    const a=await aOpt('mp4a.40.2');
    if(v&&a)return{kind:'mp4',v,a:'mp4a.40.2'};
    if(v&&!needA)return{kind:'mp4',v,a:null};
  }
  const v9=await vOpt(['vp09.00.10.08','vp09.00.40.08']);
  const op=await aOpt('opus');
  if(v9&&op)return{kind:'webm',v:v9,a:'opus',vc:'V_VP9'};
  const v8=await vOpt(['vp8']);

  return null;
}

  const s=Math.min(1,1600/Math.max(w,h)),W=Math.max(1,Math.round(w*s)),H=Math.max(1,Math.round(h*s));
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d',{willReadFrequently:true});g.drawImage(el,0,0,W,H);
  const id=g.getImageData(0,0,W,H);return{w:W,h:H,data:id.data,cv};
}
/* 膨胀（盒形，行列各一遍） */
function segDil(m,w,h,r){
  if(r<=0)return m;
  const t=new Uint8Array(w*h),o=new Uint8Array(w*h),ps=new Int32Array(Math.max(w,h)+1);
  for(let y=0;y<h;y++){const row=y*w;ps[0]=0;for(let x=0;x<w;x++)ps[x+1]=ps[x]+m[row+x];
    for(let x=0;x<w;x++)t[row+x]=ps[Math.min(w,x+r+1)]-ps[Math.max(0,x-r)]>0?1:0}
  for(let x=0;x<w;x++){ps[0]=0;for(let y=0;y<h;y++)ps[y+1]=ps[y]+t[y*w+x];
    for(let y=0;y<h;y++)o[y*w+x]=ps[Math.min(h,y+r+1)]-ps[Math.max(0,y-r)]>0?1:0}
  return o;
}
function segErode(m,w,h,r){const inv=new Uint8Array(w*h);for(let i=0;i<inv.length;i++)inv[i]=m[i]?0:1;const d=segDil(inv,w,h,r);const o=new Uint8Array(w*h);for(let i=0;i<o.length;i++)o[i]=d[i]?0:1;return o}
/* 8 连通域 */
function segCC(m,w,h){
  const n=w*h,lab=new Int32Array(n),st=new Int32Array(n),comps=[null];let cnt=0;
  for(let i=0;i<n;i++){
    if(!m[i]||lab[i])continue;
    cnt++;let sp=0,area=0,x0=w,y0=h,x1=0,y1=0;st[sp++]=i;lab[i]=cnt;
    while(sp){
      const p=st[--sp],x=p%w,y=(p/w)|0;area++;
      if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
      for(let dy=-1;dy<=1;dy++){const ny=y+dy;if(ny<0||ny>=h)continue;
        for(let dx=-1;dx<=1;dx++){const nx=x+dx;if(nx<0||nx>=w)continue;const q=ny*w+nx;if(m[q]&&!lab[q]){lab[q]=cnt;st[sp++]=q}}}
    }
    comps.push({area,x0,y0,x1,y1});
  }
  return{lab,n:cnt,comps};
}
function segLayerFromFull(full,w,h,name){
  let x0=w,y0=h,x1=-1,y1=-1,area=0;
  for(let y=0;y<h;y++){const row=y*w;for(let x=0;x<w;x++)if(full[row+x]){area++;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}
  if(!area)return null;
  const bw=x1-x0+1,bh=y1-y0+1,m=new Uint8Array(bw*bh);
  for(let y=0;y<bh;y++)for(let x=0;x<bw;x++)m[y*bw+x]=full[(y0+y)*w+x0+x];
  return segMk({bx:x0,by:y0,bw,bh,m,area,name});
}
function segMk(o){
  const L=Object.assign({id:uid(),on:true},o);L.name=L.name||('元素 '+(SEG.seq++));
  L.color=SEGCOL[(SEG.layers.length+SEG.seq)%SEGCOL.length];
  const c=document.createElement('canvas');c.width=L.bw;c.height=L.bh;const g=c.getContext('2d'),id=g.createImageData(L.bw,L.bh);
  const rgb=[parseInt(L.color.slice(1,3),16),parseInt(L.color.slice(3,5),16),parseInt(L.color.slice(5,7),16)];
  for(let i=0;i<L.m.length;i++)if(L.m[i]){const j=i*4;id.data[j]=rgb[0];id.data[j+1]=rgb[1];id.data[j+2]=rgb[2];id.data[j+3]=255}
  g.putImageData(id,0,0);L.tint=c;return L;
}
function segFull(L){const {w,h}=SEG.src,f=new Uint8Array(w*h);for(let y=0;y<L.bh;y++)for(let x=0;x<L.bw;x++)if(L.m[y*L.bw+x])f[(L.by+y)*w+L.bx+x]=1;return f}
/* 取出前景（透明度 / 背景色） */
function segFg(img,tol){
  const {w,h,data}=img,n=w*h,fg=new Uint8Array(n);let tr=0;
  for(let i=0;i<n;i++)if(data[i*4+3]<24)tr++;
  if(tr>n*.02){for(let i=0;i<n;i++)fg[i]=data[i*4+3]>=24?1:0;return{fg,mode:'alpha'}}
  const hist=new Map(),bd=[];
  const take=p=>{const j=p*4,key=(data[j]>>4)<<8|(data[j+1]>>4)<<4|(data[j+2]>>4);hist.set(key,(hist.get(key)||0)+1);bd.push(p)};
  for(let x=0;x<w;x++){take(x);take((h-1)*w+x)}for(let y=1;y<h-1;y++){take(y*w);take(y*w+w-1)}
  let best=-1,bc=0;for(const [k,c] of hist)if(c>bc){bc=c;best=k}
  let r=0,g=0,b=0,c=0;for(const p of bd){const j=p*4,key=(data[j]>>4)<<8|(data[j+1]>>4)<<4|(data[j+2]>>4);if(key===best){r+=data[j];g+=data[j+1];b+=data[j+2];c++}}
  r/=c;g/=c;b/=c;
  const t2=tol*tol,near=p=>{const j=p*4;if(data[j+3]<24)return true;const dr=data[j]-r,dg=data[j+1]-g,db=data[j+2]-b;return dr*dr+dg*dg+db*db<=t2};
  let okb=0;for(const p of bd)if(near(p))okb++;
  if(okb<bd.length*.6)return{fg:null,mode:'color'};
  const bgm=new Uint8Array(n),st=new Int32Array(n);let sp=0;
  for(const p of bd)if(near(p)&&!bgm[p]){bgm[p]=1;st[sp++]=p}
  while(sp){const p=st[--sp],x=p%w,y=(p/w)|0;
    if(x>0&&!bgm[p-1]&&near(p-1)){bgm[p-1]=1;st[sp++]=p-1}
    if(x<w-1&&!bgm[p+1]&&near(p+1)){bgm[p+1]=1;st[sp++]=p+1}
    if(y>0&&!bgm[p-w]&&near(p-w)){bgm[p-w]=1;st[sp++]=p-w}
    if(y<h-1&&!bgm[p+w]&&near(p+w)){bgm[p+w]=1;st[sp++]=p+w}}
  for(let i=0;i<n;i++)fg[i]=bgm[i]?0:1;
  return{fg,mode:'bg',bg:[r,g,b]};
}
function segKmeans(img,K){
  const {w,h,data}=img,n=w*h,step=Math.max(1,Math.floor(n/6000)),S_=[];
  for(let i=0;i<n;i+=step)S_.push([data[i*4],data[i*4+1],data[i*4+2]]);
  const C=[S_[0].slice()];
  while(C.length<K){let bi=0,bd=-1;S_.forEach((s,i)=>{let d=1e9;for(const c of C){const e=(s[0]-c[0])**2+(s[1]-c[1])**2+(s[2]-c[2])**2;if(e<d)d=e}if(d>bd){bd=d;bi=i}});C.push(S_[bi].slice())}
  for(let it=0;it<8;it++){
    const sum=C.map(()=>[0,0,0,0]);
    for(const s of S_){let bi=0,bd=1e9;C.forEach((c,i)=>{const e=(s[0]-c[0])**2+(s[1]-c[1])**2+(s[2]-c[2])**2;if(e<bd){bd=e;bi=i}});const q=sum[bi];q[0]+=s[0];q[1]+=s[1];q[2]+=s[2];q[3]++}
    sum.forEach((q,i)=>{if(q[3])C[i]=[q[0]/q[3],q[1]/q[3],q[2]/q[3]]});
  }
  const lab=new Uint8Array(n);
  for(let i=0;i<n;i++){const r=data[i*4],g=data[i*4+1],b=data[i*4+2];let bi=0,bd=1e9;for(let k=0;k<C.length;k++){const c=C[k],e=(r-c[0])**2+(g-c[1])**2+(b-c[2])**2;if(e<bd){bd=e;bi=k}}lab[i]=bi}
  return{lab,K:C.length};
}
async function segAuto(){
  const img=SEG.src,{w,h}=img,n=w*h,minA=Math.max(8,SEG.minA/100*n),out=[];
  let how=SEG.how,info='';
  let f=null;
  if(how!=='color'){f=segFg(img,SEG.tol);if(f.mode==='color'){if(how==='auto'){how='color';info='背景不是纯色，改用“按颜色分层”。'}else f=null}else info=f.mode==='alpha'?'按透明度拆分。':'已识别纯色背景并去掉。'}
  if(how==='color'||!f||!f.fg){
    const km=segKmeans(img,SEG.K);
    for(let k=0;k<km.K;k++){
      const m=new Uint8Array(n);let any=0;for(let i=0;i<n;i++)if(km.lab[i]===k){m[i]=1;any++}
      if(any<minA)continue;
      const cc=segCC(m,w,h);
      for(let q=1;q<=cc.n;q++){const cp=cc.comps[q];if(cp.area<minA)continue;
        const bw=cp.x1-cp.x0+1,bh=cp.y1-cp.y0+1,mm=new Uint8Array(bw*bh);
        for(let y=0;y<bh;y++)for(let x=0;x<bw;x++)if(cc.lab[(cp.y0+y)*w+cp.x0+x]===q)mm[y*bw+x]=1;
        out.push({bx:cp.x0,by:cp.y0,bw,bh,m:mm,area:cp.area});
      }
      await _yield();
    }
  }else{
    const dm=segDil(f.fg,w,h,SEG.merge),cc=segCC(dm,w,h);
    for(let q=1;q<=cc.n;q++){
      const cp=cc.comps[q],bw=cp.x1-cp.x0+1,bh=cp.y1-cp.y0+1,mm=new Uint8Array(bw*bh);let area=0;
      for(let y=0;y<bh;y++){const ro=(cp.y0+y)*w+cp.x0;for(let x=0;x<bw;x++){if(cc.lab[ro+x]===q&&f.fg[ro+x]){mm[y*bw+x]=1;area++}}}
      if(area<minA)continue;
      out.push({bx:cp.x0,by:cp.y0,bw,bh,m:mm,area});
    }
  }
  out.sort((a,b)=>b.area-a.area);
  SEG.layers=[];SEG.seq=1;SEG.sel.clear();
  for(const o of out.slice(0,60))SEG.layers.push(segMk(o));
  return info+(out.length>60?`元素太多，只保留最大的 60 个。`:'');
}
/* 魔棒 */
function segWand(x,y,tol){
  const {w,h,data}=SEG.src,n=w*h,m=new Uint8Array(n),st=new Int32Array(n);let sp=0;
  const p0=y*w+x,j0=p0*4,r=data[j0],g=data[j0+1],b=data[j0+2],a0=data[j0+3],t2=tol*tol;
  const ok=p=>{const j=p*4;if(Math.abs(data[j+3]-a0)>60)return false;if(a0<24)return true;const dr=data[j]-r,dg=data[j+1]-g,db=data[j+2]-b;return dr*dr+dg*dg+db*db<=t2};
  m[p0]=1;st[sp++]=p0;
  while(sp){const p=st[--sp],px=p%w,py=(p/w)|0;
    if(px>0&&!m[p-1]&&ok(p-1)){m[p-1]=1;st[sp++]=p-1}
    if(px<w-1&&!m[p+1]&&ok(p+1)){m[p+1]=1;st[sp++]=p+1}
    if(py>0&&!m[p-w]&&ok(p-w)){m[p-w]=1;st[sp++]=p-w}
    if(py<h-1&&!m[p+w]&&ok(p+w)){m[p+w]=1;st[sp++]=p+w}}
  return m;
}
/* 把一个整图蒙版并进图层：新建 / 加到所选 / 从所选减去 */
function segApply(full){
  const {w,h}=SEG.src,act=[...SEG.sel][0],L=SEG.layers.find(l=>l.id===act);
  if(SEG.mode==='new'||!L){const nl=segLayerFromFull(full,w,h);if(!nl){toast('没选中任何东西');return}SEG.layers.push(nl);SEG.sel=new Set([nl.id]);return}
  const cur=segFull(L);
  for(let i=0;i<cur.length;i++){if(SEG.mode==='add'){if(full[i])cur[i]=1}else if(full[i])cur[i]=0}
  const nl=segLayerFromFull(cur,w,h,L.name),ix=SEG.layers.indexOf(L);
  if(!nl){SEG.layers.splice(ix,1);SEG.sel.clear();return}
  nl.color=L.color;SEG.layers[ix]=nl;SEG.sel=new Set([nl.id]);
}
/* 取出一个图层的透明底图 */
function segCut(L,pad){
  const {w,data}=SEG.src,p=pad||1,W=L.bw+p*2,H=L.bh+p*2;
  const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d'),id=g.createImageData(W,H);
  const mv=(x,y)=>(x<0||y<0||x>=L.bw||y>=L.bh)?0:L.m[y*L.bw+x];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const mx=x-p,my=y-p;let s=0;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)s+=mv(mx+dx,my+dy);
    const a=mv(mx,my)?(s>=9?1:(.55+.45*s/9)):(s>0?s/9*.7:0);
    if(a<=0)continue;
    const sx=L.bx+mx,sy=L.by+my,si=(Math.max(0,sy)*w+Math.max(0,Math.min(w-1,sx)))*4,d=(y*W+x)*4;
    id.data[d]=data[si];id.data[d+1]=data[si+1];id.data[d+2]=data[si+2];id.data[d+3]=Math.round(255*a*data[si+3]/255);
  }
  g.putImageData(id,0,0);return{cv:c,px:L.bx-p,py:L.by-p};
}
/* ── AI 点选（SlimSAM，放在 Worker 里，需联网下载模型） ── */
function segAIWorker(){
  if(SEG.ai)return SEG.ai;
  const code=`let model,proc,emb,raw,RI;
  const ID='Xenova/slimsam-77-uniform';
  const fast=urls=>{const ctl=urls.map(()=>new AbortController());const to=setTimeout(()=>ctl.forEach(c=>c.abort()),6000);return Promise.any(urls.map((u,i)=>fetch(u,{signal:ctl[i].signal,cache:'no-store'}).then(r=>{if(!r.ok)throw 0;ctl.forEach((c,j)=>j!==i&&c.abort());return u}))).then(u=>{clearTimeout(to);return u}).catch(()=>{clearTimeout(to);return null})};
  self.onmessage=async e=>{const m=e.data;try{
   if(m.t==='init'){
     let T=null;postMessage({t:'st',msg:'正在加载 AI 程序库…'});
     for(const u of ['https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2/+esm','https://fastly.jsdelivr.net/npm/@huggingface/transformers@3.0.2/+esm','https://unpkg.com/@huggingface/transformers@3.0.2/+esm']){try{T=await import(u);break}catch(x){}}
     if(!T)throw new Error('AI 程序库下载失败（jsdelivr / unpkg 都连不上）');
     T.env.allowLocalModels=false;RI=T.RawImage;
     postMessage({t:'st',msg:'正在选择最快的模型下载源…'});
     const hosts=['https://huggingface.co','https://hf-mirror.com'];
     const ok=await fast(hosts.map(h=>h+'/'+ID+'/resolve/main/config.json'));
     const order=ok?[hosts.find(h=>ok.startsWith(h)),...hosts.filter(h=>!ok.startsWith(h))]:hosts.slice().reverse();
     const files={},pg=p=>{if(p.file&&p.total){files[p.file]={l:p.loaded||0,t:p.total};let l=0,t=0;for(const k in files){l+=files[k].l;t+=files[k].t}postMessage({t:'prog',l,tt:t})}};
     let lastErr=null;
     for(const h of order){
       T.env.remoteHost=h+'/';
       for(const dt of ['q8',null]){
         try{postMessage({t:'st',msg:'正在从 '+h.replace('https://','')+' 下载 AI 模型…'});
           const o={progress_callback:pg};if(dt)o.dtype=dt;
           model=await T.SamModel.from_pretrained(ID,o);proc=await T.AutoProcessor.from_pretrained(ID);lastErr=null;break}catch(x){lastErr=x;model=null}
       }
       if(model)break;
     }
     if(!model)throw lastErr||new Error('模型下载失败');
     postMessage({t:'ready'})}
   else if(m.t==='embed'){raw=await RI.fromBlob(m.blob);const inp=await proc(raw);emb=await model.get_image_embeddings(inp);postMessage({t:'embedded'})}
   else if(m.t==='click'){const inputs=await proc(raw,{input_points:[[m.pts]]});const out=await model({...emb,...inputs});
     const masks=await proc.post_process_masks(out.pred_masks,inputs.original_sizes,inputs.reshaped_input_sizes);
     const t=masks[0],d=t.dims,H=d[d.length-2],W=d[d.length-1],sc=out.iou_scores.data;let bi=0;for(let i=1;i<sc.length;i++)if(sc[i]>sc[bi])bi=i;
     const o=new Uint8Array(W*H),off=bi*W*H;for(let i=0;i<W*H;i++)o[i]=t.data[off+i]?1:0;postMessage({t:'mask',m:o,W,H},[o.buffer])}
  }catch(err){postMessage({t:'err',msg:String(err&&err.message||err)})}}`;
  const url=URL.createObjectURL(new Blob([code],{type:'text/javascript'}));
  const w=new Worker(url);SEG.ai={w,ready:false,embedded:false,url};return SEG.ai;
}
function segAIcall(msg,want,transfer){
  const A=segAIWorker();
  return new Promise((res,rej)=>{
    const h=e=>{const d=e.data;
      if(d.t==='st'){segBusy(d.msg);return}
      if(d.t==='prog'){const mb=x=>(x/1048576).toFixed(1);segBusy(`下载 AI 模型 ${mb(d.l)} / ${mb(d.tt)} MB（只第一次，之后会缓存）`);return}
      if(d.t==='err'){A.w.removeEventListener('message',h);rej(new Error(d.msg));return}
      if(d.t===want){A.w.removeEventListener('message',h);res(d)}};
    A.w.addEventListener('message',h);A.w.postMessage(msg,transfer||[]);
  });
}

}
