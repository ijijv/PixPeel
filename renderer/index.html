<!doctype html><html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: file:; style-src 'self' 'unsafe-inline'; script-src 'self' blob: 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://fastly.jsdelivr.net https://unpkg.com; worker-src 'self' blob:; connect-src 'self' data: blob: https:; media-src 'self'">
<title>PixPeel</title><link rel="stylesheet" href="style.css"></head><body>
<aside class="rail">
  <div class="logo" title="PixPeel">
    <svg class="logoSvg" viewBox="0 0 100 100" aria-hidden="true">
      <rect x="6" y="6" width="88" height="88" rx="23" fill="#ff6b3d"/>
      <rect class="logodash" x="24.5" y="24.5" width="51" height="51" rx="7" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="10 8"/>
      <circle cx="50" cy="50" r="8.2" fill="#fff"/>
    </svg>
  </div>
  <nav id="nav">
    <button data-v="edit" class="on"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3" stroke-dasharray="3 3"/><path d="M9 15l2-6 4 3-3 1 2 3"/></svg><span data-i18n="navEdit">拆元素</span></button>
    <button data-v="lib"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg><span data-i18n="navLib">素材库</span></button>
    <button data-v="board"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><circle cx="9" cy="10.5" r="1.8"/><path d="M4 17l5-4 3.5 3 3-2.5 4.5 3.5"/></svg><span data-i18n="navBoard">画板</span></button>
    <button data-v="svglib"><svg class="i" viewBox="0 0 24 24"><path d="M5 4h9l5 5v11H5z"/><path d="M14 4v5h5"/><path d="M9 13l2 2 4-4"/></svg><span data-i18n="navSvgLib">SVG 库</span></button>
    <button data-v="svgcanvas"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/><path d="M3.5 15l4-4 3 3 4-5 6 6"/></svg><span data-i18n="navSvgCanvas">SVG 画布</span></button>
    <button data-v="set"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span data-i18n="navSet">设置</span></button>
  </nav>
  <span class="sp"></span>
  <button class="act" id="btnImp"><svg class="i" viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg><span data-i18n="btnImp">导入图片</span></button>
  <button class="act main" id="btnCap"><svg class="i" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/></svg><span data-i18n="btnCap">框选屏幕</span></button>
  <div id="hkTip"></div>
</aside>
<main>
  <section class="view on" id="v-edit"></section>
  <section class="view" id="v-lib"></section>
  <section class="view" id="v-board"></section>
  <section class="view" id="v-svglib"></section>
  <section class="view" id="v-svgcanvas"></section>
  <section class="view" id="v-set"></section>
</main>
<div id="toast"></div>
<div id="dropHint"></div>
<script src="i18n.js"></script><script src="engine.js"></script><script src="app.js"></script><script src="board.js"></script><script src="svg.js"></script><script src="extras.js"></script>
</body></html>
